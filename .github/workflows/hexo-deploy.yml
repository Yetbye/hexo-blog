name: Build Hexo and push to user site

# 触发条件：push 到任何分支（默认 main）时自动构建并推送到 user site
on:
  push:
    branches:
      - main
      - 'backup/site-snapshot-*'
  workflow_dispatch:  # 也支持手动触发

concurrency:
  group: deploy
  cancel-in-progress: false

# 默认 read；部署步骤需要 write（推送 Yetbye.github.io 仓库的权限来自 GH_PAGES_TOKEN secret）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site (public/)
        run: npx hexo generate

      - name: Prepare deploy
        run: |
          # 拷贝必要的辅助资源（与 hexo-blog 同级目录里可能需要）
          # public/ 已含所有内容，cn 健康即可
          ls public | head

      - name: Verify deploy token is configured
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "::error::GH_PAGES_TOKEN secret is not set. Please add it at https://github.com/Yetbye/hexo-blog/settings/secrets/actions/new (Name: GH_PAGES_TOKEN, Value: a PAT with 'repo' scope)"
            exit 1
          fi
          echo "GH_PAGES_TOKEN is set (length: ${#GH_PAGES_TOKEN})"

      - name: Deploy to Yetbye/Yetbye.github.io (user site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Yetbye/Yetbye.github.io
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
          commit_message: "deploy: hexo build ${{ github.sha }}"
