<!-- ============ 笔记 · 水墨丹青（自足纸底画布；数据源 notebooks.json，契约不变） ============ -->
<div class="ik-scroll">
  <div class="ik-container">
    <div class="ik-mountain" aria-hidden="true"></div>
    <div class="ik-mountain" aria-hidden="true"></div>
    <svg class="ik-cloud ik-cloud-a" viewBox="0 0 120 40" aria-hidden="true"><path d="M10 30 q10 -18 26 -12 q6 -14 24 -10 q16 3 18 14 q14 -2 16 8 z" fill="none" stroke="#4A4A4A" stroke-width="1.4" opacity=".35"/></svg>
    <svg class="ik-cloud ik-cloud-b" viewBox="0 0 120 40" aria-hidden="true"><path d="M10 30 q10 -18 26 -12 q6 -14 24 -10 q16 3 18 14 q14 -2 16 8 z" fill="none" stroke="#7A6B52" stroke-width="1.2" opacity=".28"/></svg>
    <div class="ik-corner ik-corner-tl" aria-hidden="true"></div>
    <div class="ik-corner ik-corner-br" aria-hidden="true"></div>

    <!-- 竖排题签 -->
    <aside class="ik-slip" aria-hidden="true">
      <span class="ik-slip-seal">墨</span>
      <span class="ik-slip-text">笔记簿</span>
    </aside>

    <header class="ik-hero">
      <span class="ik-eyebrow">NOTEBOOKS</span>
      <h1 class="ik-title">笔记簿</h1>
      <p class="ik-hand">一页一页，慢慢写完</p>
      <div class="ik-inkline" aria-hidden="true"></div>
    </header>

    <section id="notebooks-grid" class="ik-grid" aria-live="polite"></section>
    <nav id="pagination" class="ik-pagination" aria-label="笔记本分页"></nav>

    <div class="ik-foot"><span>墨</span><p>笔记皆为基础概念的手抄与整理</p></div>
  </div>
</div>

<style>
/* ===== 页面骨架外壳（SHARED_LAYOUT_SPEC v1：min-height:100vh; padding:20px; 装饰层 absolute 不占流） ===== */
.ik-scroll {
  position:relative; min-height:100vh; padding:20px;
}
/* 契约内容列（max-width:1200px; margin:0 auto; padding:20px），承接原纸底画布视觉——配色/边框/阴影数值一字未改 */
.ik-container {
  position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:20px;
  background:
    radial-gradient(900px 300px at 12% 0, rgba(61,90,74,.05), transparent 60%),
    linear-gradient(#F8F6F0, #F0EDE4);
  border:1px solid #E2DDD0; border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);
  overflow:hidden;
  font-family:'Noto Sans SC',-apple-system,sans-serif; color:#1A1A1A;
}
/* 远山水墨剪影（SI-03，页底） */
.ik-mountain {
  position:absolute; left:0; right:0; bottom:0; height:130px; pointer-events:none; opacity:.08;
  background:
    radial-gradient(140px 90px at 12% 100%, #2D2D2D 60%, transparent 61%),
    radial-gradient(200px 120px at 38% 100%, #2D2D2D 60%, transparent 61%),
    radial-gradient(120px 80px at 62% 100%, #2D2D2D 60%, transparent 61%),
    radial-gradient(220px 130px at 88% 100%, #2D2D2D 60%, transparent 61%);
  filter:blur(2px);
}
.ik-corner { position:absolute; width:50px; height:50px; pointer-events:none; z-index:2; }
.ik-corner::before { content:''; position:absolute; inset:0; border:2px solid #2D2D2D; opacity:.35; }
.ik-corner::after  { content:''; position:absolute; inset:5px; border:1px solid #C44D3F; opacity:.5; }
.ik-corner-tl { top:18px; left:18px; } .ik-corner-tl::before,.ik-corner-tl::after { border-right:0; border-bottom:0; }
.ik-corner-br { bottom:18px; right:18px; } .ik-corner-br::before,.ik-corner-br::after { border-left:0; border-top:0; }

/* 竖排题签（本页签名元素） */
.ik-slip {
  position:absolute; top:2.2rem; right:1.4rem; z-index:2;
  writing-mode:vertical-rl; display:flex; align-items:center; gap:.55rem;
  background:linear-gradient(#FFFDF6,#F7F1E3);
  border:1px solid #D9C7A1; border-radius:6px; padding:.9rem .42rem;
  box-shadow:2px 3px 10px rgba(61,50,40,.18);
}
.ik-slip-text {
  font-family:'Noto Serif SC',serif; font-size:1rem; letter-spacing:.32em; color:#4A4A4A;
}
.ik-slip-seal {
  writing-mode:horizontal-tb; width:26px; height:26px; border-radius:4px;
  display:grid; place-items:center; background:#C44D3F; color:#F8F6F0;
  font-family:'Noto Serif SC',serif; font-size:.85rem;
}

/* Hero */
.ik-hero { position:relative; z-index:1; text-align:center; padding:.6rem 1rem 1.8rem; }
.ik-eyebrow {
  display:block; font-family:'JetBrains Mono',monospace; font-size:.68rem;
  letter-spacing:.42em; color:#6B4C3B; margin-bottom:.75rem;
}
.ik-title {
  font-family:'Noto Serif SC',serif; font-weight:900; letter-spacing:.22em;
  font-size:clamp(1.9rem,4.4vw,2.8rem); margin:0 0 .7rem; color:#1A1A1A;
}
.ik-hand { font-family:'Ma Shan Zheng',cursive; font-size:1.15rem; color:#6B4C3B; margin:0 0 1rem; }
.ik-inkline {
  width:150px; height:7px; margin:0 auto; border-radius:50% 50% 50% 50%/60% 40% 60% 40%;
  background:radial-gradient(ellipse at center, rgba(26,26,26,.5), transparent 70%);
  filter:blur(1px);
}

/* 笔记本卡片：册页式 */
.ik-grid {
  position:relative; z-index:1;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:1.4rem;
  min-height:180px;
}
.ik-book {
  background:linear-gradient(#FFFDF6,#FAF5EA);
  border:1px solid #D9C7A1; border-radius:10px;
  padding:1.3rem 1.4rem 1.15rem; position:relative; overflow:hidden;
  box-shadow:3px 4px 0 rgba(61,50,40,.08), 0 6px 18px rgba(61,50,40,.1);
  transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
}
.ik-book:hover { transform:translateY(-6px); box-shadow:4px 8px 0 rgba(61,50,40,.1), 0 16px 34px rgba(61,50,40,.18); }
/* 册页缝线 */
.ik-book::before {
  content:''; position:absolute; top:0; bottom:0; left:14px; width:1px;
  background:repeating-linear-gradient(#D9C7A1 0 6px, transparent 6px 12px); opacity:.7;
}
.ik-head { display:flex; align-items:center; gap:.75rem; padding-left:1rem; }
.ik-icon {
  width:42px; height:42px; border-radius:8px; flex-shrink:0;
  display:grid; place-items:center; font-size:1.15rem; color:#F8F6F0;
  background:linear-gradient(135deg,#2D2D2D,#4A4A4A);
  border:1px solid #1A1A1A;
}
.ik-name { font-family:'Noto Serif SC',serif; font-size:1.14rem; font-weight:700; letter-spacing:.06em; margin:0; color:#1A1A1A; }
.ik-sub {
  color:#8A8A8A; font-size:.84rem; margin:.3rem 0 .75rem 3.4rem; line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.ik-articles { list-style:none; margin:0; padding:.2rem 0 0 1rem; border-top:1px dashed #D9C7A1; }
.ik-article {
  display:flex; align-items:center; gap:.55rem; padding:.5rem .3rem;
  font-size:.89rem; color:#4A4A4A; text-decoration:none; border-radius:6px;
  transition:background .2s, color .2s, padding-left .25s cubic-bezier(.16,1,.3,1);
}
.ik-article:hover { background:rgba(196,77,63,.06); color:#C44D3F; padding-left:.65rem; }
.ik-article i { color:#C44D3F; width:15px; text-align:center; font-size:.8rem; }
.ik-article time { margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:.7rem; color:#8A8A8A; }
.ik-empty-tip { list-style:none; padding:.65rem .2rem .2rem; margin:0; font-family:'Ma Shan Zheng',cursive; color:#8A8A8A; font-size:1rem; }

/* 分页 */
.ik-pagination { display:flex; justify-content:center; gap:.5rem; margin:1.9rem 0 0; position:relative; z-index:1; }
.ik-page-btn {
  min-width:34px; height:34px; border-radius:8px; border:1px solid #D9C7A1;
  background:#FFFDF6; color:#4A4A4A; font-family:'Noto Serif SC',serif; cursor:pointer;
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.ik-page-btn:hover:not(:disabled) { border-color:#C44D3F; color:#C44D3F; transform:translateY(-2px); }
.ik-page-btn.active { background:#2D2D2D; border-color:#2D2D2D; color:#F8F6F0; }
.ik-page-btn:disabled { opacity:.35; cursor:not-allowed; }

/* 状态 */
.ik-state { grid-column:1/-1; text-align:center; padding:2.6rem 0; color:#8A8A8A; font-size:.9rem; }
.ik-state .spin {
  display:inline-block; width:15px; height:15px; margin-right:.5rem; vertical-align:-3px;
  border:2px solid #D9C7A1; border-top-color:#C44D3F; border-radius:50%;
  animation:ik-spin .7s linear infinite;
}
@keyframes ik-spin { to { transform:rotate(360deg);} }

.ik-foot { position:relative; z-index:1; text-align:center; margin-top:2rem; }
.ik-foot span {
  display:inline-grid; place-items:center; width:26px; height:26px; border-radius:4px;
  background:#C44D3F; color:#F8F6F0; font-family:'Noto Serif SC',serif; font-size:.85rem;
}
.ik-foot p { font-family:'Ma Shan Zheng',cursive; font-size:1rem; color:#6B4C3B; margin:.5rem 0 0; }

@media (max-width:640px){ .ik-scroll{padding:2rem 1.1rem 1.8rem;} .ik-grid{grid-template-columns:1fr;} .ik-slip{display:none;} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
.ik-cloud{position:absolute;pointer-events:none;z-index:1}
.ik-cloud-a{width:130px;top:64px;left:6%;animation:ik-drift 9s ease-in-out infinite alternate}
.ik-cloud-b{width:90px;top:150px;right:8%;animation:ik-drift 11s ease-in-out infinite alternate-reverse}
@keyframes ik-drift{from{transform:translateX(0)}to{transform:translateX(26px)}}
@media(prefers-reduced-motion:reduce){.ik-cloud{animation:none!important}}
/* 契约断点：网格降列、隐藏大装饰（云）；山影/题签等小件保留，640px 规则原样保留 */
@media (max-width:900px){ .ik-grid{grid-template-columns:1fr} .ik-cloud{display:none} }
</style>

<script>
(function () {
  'use strict';
  var currentPage = 1;
  var notebooksPerPage = 4;
  var totalPages = 1;
  var allNotebooks = [];

  function generateArticleUrl(notebookSlug, article) {
    if (article.slug) return '/categories/' + notebookSlug + '/' + encodeURIComponent(article.slug) + '/';
    return '/categories/' + notebookSlug + '/' +
      article.title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '/';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function loadNotebooks() {
    var grid = document.getElementById('notebooks-grid');
    if (!grid) return;
    grid.innerHTML = '<div class="ik-state"><span class="spin"></span>正在翻册…</div>';
    fetch('notebooks.json')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        allNotebooks = data || [];
        totalPages = Math.max(1, Math.ceil(allNotebooks.length / notebooksPerPage));
        renderNotebooks(currentPage);
        renderPagination(currentPage);
      })
      .catch(function (err) {
        console.error('加载笔记本数据失败:', err);
        grid.innerHTML = '<div class="ik-state">⚠ 数据加载失败 — 请刷新重试</div>';
      });
  }

  function renderNotebooks(page) {
    var container = document.getElementById('notebooks-grid');
    if (!container) return;
    if (!allNotebooks.length) {
      container.innerHTML = '<div class="ik-state">册页尚空，落笔为开 ✿</div>';
      return;
    }
    var start = (page - 1) * notebooksPerPage;
    var pageData = allNotebooks.slice(start, start + notebooksPerPage);
    container.innerHTML = pageData.map(function (nb) {
      var items = (nb.articles || []).map(function (a) {
        // 优先使用 CMS 维护的真实 URL（notebooks.json 的 url 字段）；回退按 slug 猜测
        var href = a.url || generateArticleUrl(nb.slug, a);
        return '<li><a class="ik-article" href="' + esc(href) + '">' +
          '<i class="' + esc(a.icon || 'fas fa-file-alt') + '"></i>' +
          '<span>' + esc(a.title) + '</span>' +
          (a.date ? '<time>' + esc(a.date) + '</time>' : '') +
          '</a></li>';
      }).join('');
      if (!items) items = '<li class="ik-empty-tip">这一册还空着，等一个开头。</li>';
      // 「论文精读」笔记本：卡片直接跳合集页 /docs/，而不是笔记本详情页
      var nbHref = nb.redirect || ('/notes/' + encodeURIComponent(nb.slug) + '/');
      return '' +
        '<article class="ik-book" style="cursor:pointer" onclick="if(!event.target.closest(\'a\'))location.href=\'' + nbHref + '\'">' +
        '  <div class="ik-head">' +
        '    <span class="ik-icon"><i class="' + esc(nb.icon || 'fas fa-book') + '"></i></span>' +
        '    <h2 class="ik-name"><a href="' + nbHref + '" style="color:inherit;text-decoration:none">' + esc(nb.name) + '</a>' +
        '      <a href="' + nbHref + '" style="font-size:.72rem;color:var(--v-sakura,#E86B8A);font-family:\'Noto Sans SC\',sans-serif;font-weight:400;margin-left:.4rem">打开本册 →</a></h2>' +
        '  </div>' +
        '  <p class="ik-sub">' + esc(nb.subtitle || '') + '</p>' +
        '  <ul class="ik-articles">' + items + '</ul>' +
        '</article>';
    }).join('');
  }

  function renderPagination(page) {
    var box = document.getElementById('pagination');
    if (!box) return;
    if (totalPages <= 1) { box.innerHTML = ''; return; }
    var html = '<button class="ik-page-btn" data-p="prev"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button class="ik-page-btn' + (i === page ? ' active' : '') + '" data-p="' + i + '">' + i + '</button>';
    }
    html += '<button class="ik-page-btn" data-p="next"' + (page >= totalPages ? ' disabled' : '') + '>›</button>';
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.ik-page-btn'), function (btn) {
      btn.addEventListener('click', function () {
        if (this.disabled) return;
        var v = this.getAttribute('data-p');
        if (v === 'prev') currentPage = Math.max(1, currentPage - 1);
        else if (v === 'next') currentPage = Math.min(totalPages, currentPage + 1);
        else currentPage = parseInt(v, 10);
        renderNotebooks(currentPage);
        renderPagination(currentPage);
      });
    });
  }

  function boot() { loadNotebooks(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
