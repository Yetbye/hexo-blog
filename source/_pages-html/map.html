<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Ma+Shan+Zheng&family=JetBrains+Mono&display=swap');

:root {
  --paper:#F2E7C8; --ink:#3D2914; --ink2:#6A5050; --plum:#7A2F3F;
  --sakura:#C44D3F; --gold:#C4A36F; --line:#E8D9A6;
}

.gm-page {
  position:relative;
  min-height:100vh; padding:48px 20px 24px;
  font-family:'Noto Serif SC',serif; color:var(--ink);
  background:
    radial-gradient(ellipse 800px 600px at 20% 0%, rgba(212,168,122,.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 100%, rgba(122,47,63,.10), transparent 60%),
    var(--paper);
  overflow-x:hidden;
}
.gm-container { max-width:1200px; margin:0 auto; padding:0 6px; position:relative; z-index:2; }

/* page-level 四角装饰 */
.gm-page-corner { position:absolute; width:120px; height:120px; z-index:1; pointer-events:none; opacity:.9; }
.gm-page-tl { top:6px;    left:6px; }
.gm-page-tr { top:6px;    right:6px; }
.gm-page-bl { bottom:6px; left:6px; }
.gm-page-br { bottom:6px; right:6px; }

.gm-hero { text-align:center; padding:1.6rem 0 1.6rem; position:relative; border-bottom:1px solid rgba(122,79,42,.4); margin-bottom:1.6rem; min-height:140px; }
.gm-sword { position:absolute; top:6px; width:36px; height:130px; filter:drop-shadow(0 4px 6px rgba(61,41,20,.25)); }
.gm-sword-left  { left:14%; transform:rotate(-6deg); }
.gm-sword-right { right:14%; transform:rotate(6deg) scaleX(-1); }
.gm-eyebrow { font-family:'JetBrains Mono',monospace; font-size:.95rem; letter-spacing:.42em; color:var(--plum); display:block; margin-bottom:.6rem; }
.gm-title { font-family:'Noto Serif SC',serif; font-weight:900; font-size:clamp(2.8rem,6vw,4rem); letter-spacing:.25em; margin:.4rem 0 .2rem; color:var(--ink); text-shadow:2px 2px 0 rgba(122,47,63,.12); }
.gm-hand { font-family:'Ma Shan Zheng',cursive; font-size:1.6rem; color:var(--plum); margin:.6rem 0 1.2rem; letter-spacing:.12em; }
.gm-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; }
.gm-chip { display:inline-block; padding:.5rem 1.2rem; background:rgba(255,245,230,.55); border:1px solid var(--gold); font-size:1rem; }
.gm-chip b { color:var(--sakura); font-weight:700; }

.gm-tabs { display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; align-items:center; margin:0 0 1.2rem; padding-bottom:.4rem; }
.gm-tab { padding:.6rem 1.5rem; background:rgba(255,245,230,.6); border:1px solid var(--gold); font-family:'Noto Serif SC',serif; font-size:1.05rem; color:var(--ink2); cursor:pointer; transition:all .25s; border-radius:2px; }
.gm-tab:hover { background:rgba(196,67,95,.15); color:var(--plum); }
.gm-tab.active { background:var(--plum); color:#FFF6D6; border-color:var(--plum); box-shadow:0 4px 12px rgba(122,47,63,.35); font-weight:700; }
.gm-tab-ornament { display:inline-flex; align-items:center; width:40px; height:14px; }
.gm-tab-ornament svg { width:100%; height:100%; }

.gm-map-frame { position:relative; background:var(--paper); border:2px solid var(--ink); box-shadow:inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--gold), 0 8px 32px rgba(61,41,20,.4); overflow:hidden; border-radius:2px; }
/* 4 内角角饰（absolute, z-index 5, pointer-events none） */
.gm-corner { position:absolute; width:80px; height:80px; z-index:5; pointer-events:none; }
.gm-corner-tl { top:0;    left:0; }
.gm-corner-tr { top:0;    right:0; }
.gm-corner-bl { bottom:0; left:0; }
.gm-corner-br { bottom:0; right:0; }
.gm-map { width:100%; height:auto; display:block; }
.city-marker { cursor:pointer; transition:transform .25s; }
.city-marker:hover { transform:scale(1.15); }

.gm-note-panel { position:absolute; top:30px; right:30px; width:min(420px,90%); max-height:calc(100% - 60px); overflow-y:auto; background:linear-gradient(180deg, #FFFBE8, #FFF6D6); border:2px solid var(--ink); box-shadow:inset 0 0 0 3px #FFFBE8, inset 0 0 0 4px var(--gold), 6px 6px 0 rgba(61,41,20,.45); z-index:10; font-family:'Noto Serif SC',serif; animation:gmNoteIn .4s cubic-bezier(.16,1,.3,1); }
@keyframes gmNoteIn { from { opacity:0; transform:translateY(-12px) rotate(-1deg); } to { opacity:1; transform:rotate(-.4deg); } }
.gm-note-panel::before { content:''; position:absolute; top:-9px; left:38%; width:60px; height:18px; background:rgba(196,67,95,.65); transform:rotate(-3deg); }
.gm-note-header { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px dashed var(--gold); background:rgba(255,245,230,.6); }
.gm-note-city { font-family:'Noto Serif SC',serif; font-weight:900; font-size:1.45rem; color:var(--ink); letter-spacing:.12em; }
.gm-note-count { font-family:'JetBrains Mono',monospace; font-size:.78rem; color:var(--plum); margin-left:auto; }
.gm-note-close { background:#FFFBE8; border:1px solid var(--ink); color:var(--ink); font-size:1.1rem; cursor:pointer; width:24px; height:24px; line-height:1; padding:0; }
.gm-note-close:hover { background:var(--sakura); color:#fff; }
.gm-note-content { padding:18px 20px 22px; }
.gm-poem-card { position:relative; padding:14px 16px 14px 22px; margin-bottom:18px; background:rgba(196,163,111,.12); border-left:3px solid var(--gold); }
.gm-poem-date { font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--plum); margin-bottom:4px; letter-spacing:.05em; }
.gm-poem-title { font-family:'Ma Shan Zheng',cursive; font-size:1.15rem; color:var(--plum); margin:0 0 8px; }
.gm-poem-text { font-family:'Noto Serif SC',serif; font-size:.92rem; line-height:1.85; color:var(--ink); margin:0 0 6px; white-space:pre-line; }
.gm-poem-note { font-size:.78rem; color:var(--ink2); font-style:italic; margin:0; padding-top:4px; border-top:1px dashed var(--line); }
.gm-poem-nav { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.gm-poem-counter { font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--ink2); }
.gm-poem-btn { background:transparent; border:1px solid var(--ink); color:var(--ink); font-family:'Noto Sans SC',sans-serif; font-size:.72rem; padding:2px 8px; cursor:pointer; }
.gm-poem-btn:hover { background:var(--ink); color:#FFFBE8; }
.gm-poem-btn:disabled { opacity:.3; cursor:not-allowed; }

.gm-foot { margin-top:2rem; text-align:center; padding-bottom:.4rem; }
/* 倒数第二行：墨色深红，红色 line-through，不消失 */
.gm-foot-line1 { font-family:'Noto Serif SC',serif; font-size:1.6rem; color:#6A3030; margin:0 0 .5rem; letter-spacing:.18em; font-weight:600; }
.gm-foot-strike { display:inline-block; text-decoration:line-through; text-decoration-color:#C44D3F; text-decoration-thickness:3px; opacity:.55; }
/* 最后一行：Ma Shan Zheng 草书 + 略大加粗 + 居中 + 狂草黑白水墨质感 */
.gm-foot-line2 {
  font-family:'Ma Shan Zheng',cursive;
  font-size:clamp(2.2rem,4vw,2.8rem);
  font-weight:700;
  color:#1A1410;
  margin:0;
  letter-spacing:.22em;
  text-align:center;
  text-shadow:
    0 0 0.5px rgba(26,20,16,.95),
    1px 1px 0 rgba(26,20,16,.55),
    -0.6px -0.4px 0 rgba(26,20,16,.45),
    2px 2px 3px rgba(26,20,16,.18),
    3px 3px 6px rgba(26,20,16,.10),
    -1px 0 2px rgba(60,60,60,.18),
    1px -1px 2px rgba(60,60,60,.15);

<script>
(function () {
'use strict';

let PLACES = [];
fetch('/data/places.json').then(r => r.json()).then(d => {
  PLACES = (d || []).filter(p => p.visited !== false);
  renderRegion(CURRENT);
  updateCounters();
}).catch(e => console.error(e));

function getPoems(p) {
  if (p.poems && Array.isArray(p.poems)) return p.poems;
  if (p.poem) return [{ date:p.date||'', poemTitle:p.poemTitle||'行迹', poem:p.poem, note:p.note||'' }];
  return [];
}

function updateCounters() {
  document.getElementById('gm-count').textContent = PLACES.length;
  document.getElementById('gm-poem-count').textContent = PLACES.reduce((s, p) => s + getPoems(p).length, 0);
}

let CURRENT = 'main';
const REGION_META = {

  central: { name:'中原' }, east:    { name:'江南' }, south:   { name:'岭南' }
};

document.querySelectorAll('.gm-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.gm-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');

const REGION_THEME = {

const REGION_DECOR = {

function drawDecorItem(decor, theme) {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('filter', 'url(#ink-pen)');
  g.setAttribute('opacity', '0.65');
  function line(x1, y1, x2, y2) {
    const l = document.createElementNS(SVG_NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', theme.stroke); l.setAttribute('stroke-width', '0.8');
    return l;
  }
  function circle(cx, cy, r, fill) {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', fill || 'none'); c.setAttribute('stroke', theme.stroke); c.setAttribute('stroke-width', '0.7');
    return c;
  }
  function path(d, fill) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', fill || 'none'); p.setAttribute('stroke', theme.stroke); p.setAttribute('stroke-width', '0.7');
    return p;
  }
  function text(content, x, y) {
    const t = document.createElementNS(SVG_NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', "'Ma Shan Zheng',cursive");
    t.setAttribute('font-size', '11');
    t.setAttribute('fill', theme.stroke);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('style', 'paint-order:stroke;stroke:#F2E7C8;stroke-width:2.5;pointer-events:none');
    t.textContent = content;
    return t;
  }
  switch (decor.type) {
    case 'sail':
      g.appendChild(path('M 0 0 L 22 0 L 10 -30 Z', theme.gold));
      g.appendChild(line(11, -30, 11, 2));
      g.appendChild(path('M 11 -26 Q 24 -14 11 -2', theme.accent));
      g.appendChild(path('M -18 6 Q 0 16 36 6'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 32)); break;
    case 'camel':
      g.appendChild(path('M -22 0 Q -25 -10 -10 -12 Q 5 -15 18 -10 Q 28 -8 25 0 Z'));
      g.appendChild(line(-22, -3, -22, -16));
      g.appendChild(line(-10, 12, -12, 22));
      g.appendChild(line(8, 12, 10, 22));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 38)); break;
    case 'yak':
      g.appendChild(circle(0, 0, 22));
      g.appendChild(path('M -18 -8 Q -30 -22 -20 -30'));
      g.appendChild(path('M 18 -8 Q 30 -22 20 -30'));
      g.appendChild(line(-12, 14, -14, 26));
      g.appendChild(line(12, 14, 14, 26));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 42)); break;
    case 'kite':
      g.appendChild(path('M 0 0 Q 6 -2 4 -16 Q 2 -28 0 -32 Q -2 -28 -4 -16 Q -6 -2 0 0'));
      g.appendChild(path('M -3 -4 Q 0 -8 3 -4'));
      g.appendChild(line(0, 0, 0, 8));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 20)); break;
    case 'tea':
      g.appendChild(path('M -10 -2 L -8 -10 L 8 -10 L 10 -2 Z'));
      g.appendChild(path('M -8 -10 L -6 -18 L 6 -18 L 8 -10'));
      g.appendChild(line(2, -2, 2, 8));
      g.appendChild(path('M -2 4 Q 0 6 2 4'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 22)); break;
    case 'moon':
      g.appendChild(circle(0, 0, 14, theme.gold));
      g.appendChild(circle(4, -3, 12, '#F2E7C8'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 26)); break;
    case 'rock':
      g.appendChild(path('M -16 0 L -8 -10 L 2 -6 L 12 -14 L 18 -2 L 14 0 Z'));
      g.appendChild(line(-4, -6, 6, -10));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 16)); break;
    case 'sun':
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        g.appendChild(line(Math.cos(a) * 18, Math.sin(a) * 18, 0, 0));
      }
      const s2 = line(0, 0, 0, 0);
      s2.setAttribute('stroke', '#C44D3F');
      g.appendChild(s2);
      g.appendChild(circle(0, 0, 10, '#C44D3F'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 28)); break;
    case 'bell':
      g.appendChild(path('M -8 -10 L 8 -10 L 6 8 L -6 8 Z'));
      g.appendChild(line(0, -10, 0, -18));
      g.appendChild(circle(0, -18, 3));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 22)); break;
    case 'seal':
      g.appendChild(path('M -8 -8 L 8 -8 L 8 8 L -8 8 Z', theme.sakura));
      g.appendChild(text('迹', 0, 4));
      const sealT = text(decor.label, 0, 22);
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(sealT); break;
    case 'willow':
      g.appendChild(line(0, 0, 0, -22));
      g.appendChild(circle(0, -24, 6));
      g.appendChild(path('M 0 -20 Q -4 -10 -3 4'));
      g.appendChild(path('M 0 -20 Q 4 -10 3 4'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 18)); break;
    case 'bridge':
      g.appendChild(path('M -16 0 Q 0 -10 16 0'));
      g.appendChild(line(-16, 0, -16, 4));
      g.appendChild(line(16, 0, 16, 4));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 16)); break;
    case 'flower':
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        g.appendChild(circle(Math.cos(a) * 6, Math.sin(a) * 6, 5, theme.sakura));
      }
      g.appendChild(circle(0, 0, 3, theme.gold));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 20)); break;
    case 'fly':
      // 马身（椭圆）
      const flyBody = document.createElementNS(SVG_NS, 'ellipse');
      flyBody.setAttribute('cx', 0); flyBody.setAttribute('cy', 0);
      flyBody.setAttribute('rx', 14); flyBody.setAttribute('ry', 5);
      flyBody.setAttribute('fill', theme.accent); flyBody.setAttribute('fill-opacity', '0.4');
      flyBody.setAttribute('stroke', theme.stroke); flyBody.setAttribute('stroke-width', '0.8');
      g.appendChild(flyBody);
      // 马头（右侧小圆）
      g.appendChild(circle(12, -2, 3, theme.accent));
      // 马颈
      g.appendChild(path('M 10 -2 Q 11 -4 12 -4'));
      // 鬃毛（头部后面几条短斜线）
      g.appendChild(line(8, -3, 5, -7));
      g.appendChild(line(7, -2, 3, -6));
      g.appendChild(line(6, -1, 1, -5));
      // 四蹄
      g.appendChild(line(-9, 5, -10, 12));
      g.appendChild(line(-3, 5, -4, 12));
      g.appendChild(line(3, 5, 2, 12));
      g.appendChild(line(9, 5, 8, 12));
      // 双翅（上方两个三角翼）
      g.appendChild(path('M -8 -5 L -18 -10 L -12 -2 Z', theme.accent));
      g.appendChild(path('M -6 -4 L -16 -8 L -10 -1 Z', theme.accent));
      // 尾巴
      g.appendChild(path('M -14 2 Q -18 0 -16 6'));
      g.setAttribute('transform', `translate(${decor.x}, ${decor.y})`);
      g.appendChild(text(decor.label, 0, 26)); break;
  }
  return g;
}

function renderBgFlowers(theme) {
  const layer = document.getElementById('gm-bg-flowers');
  layer.innerHTML = '';
  const seed = theme.meta.id === 'main' ? 1 : (theme.meta.id === 'west' ? 2 : (theme.meta.id === 'central' ? 3 : (theme.meta.id === 'east' ? 4 : 5)));
  const r = (n) => Math.abs((Math.sin(n * 9301 + seed * 49297) * 233280)) % 1;
  for (let i = 0; i < 12; i++) {
    const cx = r(i + 1) * 1053;
    const cy = r(i + 100) * 935;
    const r2 = 2 + r(i + 200) * 3;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r2);
    c.setAttribute('fill', theme.accent);
    c.setAttribute('opacity', '0.25');
    layer.appendChild(c);
  }
}

function renderProvinces(theme) {
  const layer = document.getElementById('gm-province-layer');
  layer.innerHTML = '';
  if (!window.CHINA_REGIONS || !CHINA_REGIONS[theme.meta.id]) return;
  CHINA_REGIONS[theme.meta.id].features.forEach(prov => {
    prov.paths.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', theme.land);
      p.setAttribute('fill-opacity', '0.4');
      p.setAttribute('stroke', theme.stroke);
      p.setAttribute('stroke-width', '0.9');
      p.setAttribute('stroke-linejoin', 'round');
      layer.appendChild(p);
    });
  });
}

function renderDecor(theme) {
  const layer = document.getElementById('gm-decor-layer');
  layer.innerHTML = '';
  (REGION_DECOR[theme.meta.id] || []).forEach(d => layer.appendChild(drawDecorItem(d, theme)));
}

function projectP(p, r) {
  const phi = p.y * Math.PI / 180;
  const phiMin = r.latMin * Math.PI / 180, phiMax = r.latMax * Math.PI / 180;
  const yMerc = Math.log(Math.tan(Math.PI/4 + phi/2));
  const yMin = Math.log(Math.tan(Math.PI/4 + phiMin/2));
  const yMax = Math.log(Math.tan(Math.PI/4 + phiMax/2));
  return [
    (p.x - r.lonMin) / (r.lonMax - r.lonMin) * r.w,
    (yMax - yMerc) / (yMax - yMin) * r.h
  ];
}

function renderTrajectory(theme) {
  const layer = document.getElementById('trajectory');
  layer.innerHTML = '';
  if (!window.CHINA_REGIONS || !CHINA_REGIONS[theme.meta.id]) return;
  const r = theme.meta;
  const visible = PLACES.filter(p => p.x >= r.lonMin - 1 && p.x <= r.lonMax + 1 && p.y >= r.latMin - 1 && p.y <= r.latMax + 1);
  if (visible.length < 2) return;
  visible.sort((a, b) => (a.poems ? a.poems[0].date : a.date || '').localeCompare(b.poems ? b.poems[0].date : b.date || ''));
  for (let i = 0; i < visible.length - 1; i++) {
    const a = projectP(visible[i], r);
    const b = projectP(visible[i + 1], r);
    const mx = (a[0] + b[0]) / 2 + (i % 2 === 0 ? -22 : 22);
    const my = (a[1] + b[1]) / 2 + 20;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${a[0]} ${a[1]} Q ${mx} ${my} ${b[0]} ${b[1]}`);
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#7A2F3F');
    p.setAttribute('stroke-width', '1.5'); p.setAttribute('stroke-dasharray', '5,3');
    p.setAttribute('opacity', '0.7'); p.setAttribute('marker-end', 'url(#arrow)');
    layer.appendChild(p);
  }
}

function renderCityMarkers(theme) {
  const layer = document.getElementById('city-markers');
  layer.innerHTML = '';
  if (!window.CHINA_REGIONS || !CHINA_REGIONS[theme.meta.id]) return;
  const r = theme.meta;
  PLACES.forEach(p => {
    if (p.x < r.lonMin - 1 || p.x > r.lonMax + 1 || p.y < r.latMin - 1 || p.y > r.latMax + 1) return;
    const [x, y] = projectP(p, r);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'city-marker');
    g.setAttribute('transform', `translate(${x}, ${y})`);
    g.setAttribute('data-city', p.name);
    const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c1.setAttribute('r', '11');
    c1.setAttribute('fill', '#7A2F3F');
    c1.setAttribute('stroke', '#3D2914');
    c1.setAttribute('stroke-width', '1.5');
    c1.setAttribute('filter', 'url(#stamp)');
    g.appendChild(c1);
    const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c2.setAttribute('r', '3.5'); c2.setAttribute('fill', '#F2E7C8');
    g.appendChild(c2);
    const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t1.setAttribute('x', 16); t1.setAttribute('y', -2);
    t1.setAttribute('font-family', "'Ma Shan Zheng',cursive");
    t1.setAttribute('font-size', '18');
    t1.setAttribute('fill', '#3D2914');
    t1.setAttribute('font-weight', '700');
    t1.setAttribute('style', 'paint-order:stroke;stroke:#F2E7C8;stroke-width:3.5;pointer-events:none');
    t1.textContent = p.name;
    g.appendChild(t1);
    g.addEventListener('click', (e) => { e.stopPropagation(); openNote(p); });
    layer.appendChild(g);
  });
}

let CURRENT_POEM_IDX = 0;
let CURRENT_CITY = null;
let NOTE_OPENING = false;
let LAST_OPEN_TS = 0;

function openNote(city) {
  if (!city) return;
  // 200ms 防抖：连续点击同一城市不会重新触发
  const now = Date.now();
  if (now - LAST_OPEN_TS < 200) return;
  // 任何点击都先 close 现有面板，杜绝"异常跳动"
  closeNote();
  LAST_OPEN_TS = now;
  NOTE_OPENING = true;
  CURRENT_CITY = city;
  CURRENT_POEM_IDX = 0;
  renderNote();
  document.getElementById('gm-note').style.display = 'block';
  setTimeout(() => { NOTE_OPENING = false; }, 200);
}

function renderNote() {
  if (!CURRENT_CITY) return;
  const poems = getPoems(CURRENT_CITY).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const i = Math.max(0, Math.min(CURRENT_POEM_IDX, poems.length - 1));
  const p = poems[i];
  document.getElementById('gm-note-city').textContent = CURRENT_CITY.name;
  document.getElementById('gm-note-count').textContent = poems.length > 1 ? (i + 1) + ' / ' + poems.length : String(poems.length);
  const content = document.getElementById('gm-note-content');
  content.innerHTML = '<div class="gm-poem-card">' +
    '<div class="gm-poem-date">' + esc(p.date || '') + '</div>' +
    '<h3 class="gm-poem-title">《' + esc(p.poemTitle || '行迹') + '》</h3>' +
    '<p class="gm-poem-text">' + esc(p.poem || '') + '</p>' +
    '<p class="gm-poem-note">' + esc(p.note || '') + '</p>' +
    '</div>' +
    (poems.length > 1 ? '<div class="gm-poem-nav">' +
      '<button class="gm-poem-btn" onclick="window.__gmCyclePoem(-1)" ' + (i === 0 ? 'disabled' : '') + '>◀ 上一篇</button>' +
      '<span class="gm-poem-counter">' + (i + 1) + ' / ' + poems.length + '</span>' +
      '<button class="gm-poem-btn" onclick="window.__gmCyclePoem(1)" ' + (i === poems.length - 1 ? 'disabled' : '') + '>下一篇 ▶</button>' +
      '</div>' : '');
  content.onclick = e => e.stopPropagation();
}

window.__gmCyclePoem = function (d) {
  if (!CURRENT_CITY) return;
  const poems = getPoems(CURRENT_CITY);
  CURRENT_POEM_IDX = Math.max(0, Math.min(CURRENT_POEM_IDX + d, poems.length - 1));
  renderNote();
};

function closeNote() {
  document.getElementById('gm-note').style.display = 'none';
  CURRENT_CITY = null;
  CURRENT_POEM_IDX = 0;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderRegion(regionId) {
  if (!window.CHINA_REGIONS) return;
  CURRENT = regionId;
  const r = CHINA_REGIONS[regionId].meta;
  const theme = Object.assign({ meta: r }, REGION_THEME[regionId]);
  closeNote();
  const svg = document.getElementById('gm-map');
  svg.setAttribute('viewBox', `0 0 ${r.w} ${r.h}`);
  document.getElementById('gm-paper').setAttribute('width', r.w);
  document.getElementById('gm-paper').setAttribute('height', r.h);
  document.getElementById('gm-paper-texture').setAttribute('width', r.w);
  document.getElementById('gm-paper-texture').setAttribute('height', r.h);
  renderBgFlowers(theme);
  renderProvinces(theme);
  renderDecor(theme);
  renderTrajectory(theme);
  renderCityMarkers(theme);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('gm-note-close').addEventListener('click', closeNote);
  document.getElementById('gm-map').addEventListener('click', e => {
    if (!e.target.closest('.city-marker') && !e.target.closest('.gm-note-panel')) {
      closeNote();
    }
  });
  setTimeout(() => renderRegion('main'), 100);
});
})();
</script>
