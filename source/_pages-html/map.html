<!-- ============ 行迹 · 像素冒险大陆（与旧卷轴地图完全相反：主动探险收集制） ============ -->
<!-- 布局骨架遵循 SHARED_LAYOUT_SPEC；美术为全新游戏化体系，站点樱粉/梅紫作 UI 点缀 -->
<div class="gk-page">
  <div class="gk-container">
    <header class="gk-hero">
      <span class="gk-eyebrow">PIXEL EXPEDITION</span>
      <h1 class="gk-title">行迹 · 像素大陆</h1>
      <p class="gk-hand">走过的土地会亮起来，迷雾之外还有远方</p>
      <span class="gk-chip">🧭 已探索 <b id="gk-count">0</b> / <span id="gk-total">0</span></span>
    </header>

    <div class="gk-frame" id="gk-frame">
      <canvas id="gk-canvas" width="1024" height="704"></canvas>
      <!-- 节点铭牌（JS 注入，DOM 保证文字锐利） -->
      <div id="gk-labels" class="gk-labels"></div>
      <div id="gk-regions" class="gk-regions" aria-hidden="true"></div>
      <!-- HUD -->
      <div class="gk-hud">
        <span class="gk-hud-key">WASD</span><span class="gk-hud-key">↑←↓→</span><span>移动</span>
        <span class="gk-hud-sep"></span>
        <span class="gk-hud-key">点击</span><span>寻路前往</span>
        <span class="gk-hud-sep"></span>
        <span class="gk-hud-key">E</span><span>读诗笺</span>
      </div>
      <!-- 任务面板 -->
      <aside class="gk-quest" id="gk-quest" aria-hidden="true">
        <button class="gk-quest-close" id="gk-qclose" aria-label="关闭">✕</button>
        <p class="gk-quest-place" id="gk-q-place">—</p>
        <p class="gk-quest-strip" id="gk-q-title"></p>
        <p class="gk-quest-date" id="gk-q-date"></p>
        <div class="gk-quest-poem" id="gk-q-poem"></div>
        <p class="gk-quest-note" id="gk-q-note"></p>
      </aside>
    </div>

    <div class="gk-foot"><span>✿</span><p>每一步都算数 —— 用方向键去把迷雾走开</p></div>
  </div>
</div>

<style>
.gk-page{
  --paper:#FFF9E6; --panel:#1E1B2E;
  --ink:#3A2828; --sakura:#E86B8A; --plum:#8B4570; --gold:#D4A87A; --line:#F0E0D8;
  min-height:100vh; padding:20px; font-family:'Noto Sans SC',-apple-system,sans-serif; color:var(--ink);
}
.gk-container{max-width:1200px;margin:0 auto;padding:20px}
.gk-hero{text-align:center;padding:.6rem 0 1.6rem}
.gk-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.42em;color:var(--sakura)}
.gk-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(1.9rem,4vw,2.7rem);letter-spacing:.16em;margin:.4rem 0 .3rem}
.gk-hand{font-family:'Ma Shan Zheng',cursive;font-size:1.15rem;color:var(--plum);margin:0 0 .7rem}
.gk-chip{display:inline-block;padding:.28rem 1rem;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:.85rem}
.gk-chip b{color:var(--sakura);font-size:1rem}

/* 游戏取景框：像素硬边框 */
.gk-frame{
  position:relative;border:4px solid var(--plum);border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 3px #FFF9E6,0 14px 40px rgba(139,69,112,.35);
  background:#101418;line-height:0;
}
#gk-canvas{width:100%;height:auto;display:block;image-rendering:pixelated}

/* 节点铭牌 */
.gk-labels{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.gk-label{
  position:absolute;transform:translate(-50%,-130%);padding:2px 8px;white-space:nowrap;
  font-family:'Noto Serif SC',serif;font-size:12px;letter-spacing:.15em;color:#fff;
  background:rgba(30,27,46,.82);border:1px solid var(--gold);border-radius:3px;
}
.gk-label::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--gold)}
.gk-label.unreached{filter:grayscale(.6);opacity:.75}

/* HUD 提示条 */
.gk-hud{
  position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:6px;background:rgba(30,27,46,.85);color:#EDE7FF;font-size:12px;
  border:1px solid rgba(212,168,122,.5);line-height:1.4;
}
.gk-hud-key{
  display:inline-block;padding:1px 7px;border-radius:4px;background:#3A3454;color:var(--gold);
  font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid rgba(212,168,122,.4);
}
.gk-hud-sep{width:1px;height:14px;background:rgba(255,255,255,.22)}

/* 任务面板：像素纸卡 */
.gk-quest{
  position:absolute;top:12px;right:12px;width:min(320px,86%);
  background:linear-gradient(160deg,#FFFDF4,#FFF6DC);
  color:var(--ink);padding:18px 20px 16px;line-height:1.85;
  box-shadow:0 0 0 2px var(--gold) inset,6px 8px 0 rgba(30,27,46,.55);
  transform:translateX(calc(100% + 24px));transition:transform .22s cubic-bezier(.16,1,.3,1);
}
.gk-quest.show{transform:none}
.gk-quest-close{
  position:absolute;top:6px;right:8px;width:24px;height:24px;background:var(--plum);color:#fff;
  border:2px solid var(--gold);cursor:pointer;font-size:12px;line-height:1;
}
.gk-quest-close:hover{background:var(--sakura)}
.gk-quest-place{font-family:'Noto Serif SC',serif;font-weight:900;font-size:1.25rem;letter-spacing:.2em;margin:0 0 2px}
.gk-quest-strip{font-family:'Ma Shan Zheng',cursive;font-size:1.05rem;color:var(--sakura);margin:0}
.gk-quest-date{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#A08880;margin:.3rem 0 .5rem}
.gk-quest-poem{
  white-space:pre-line;font-family:'Noto Serif SC',serif;font-size:1rem;line-height:2.1;
  background:repeating-linear-gradient(transparent,transparent 31px,#E8DCC0 32px);
  padding:.4rem .2rem;margin:0 -4px;
}
.gk-quest-note{font-size:.8rem;color:#8A7A6A;margin:.5rem 0 0}

.gk-foot{text-align:center;margin-top:1.5rem}
.gk-foot span{color:var(--sakura)}
.gk-foot p{font-family:'Ma Shan Zheng',cursive;color:var(--plum);font-size:1.02rem;margin:.3rem 0 0}

@media(max-width:900px){
  .gk-page{padding:12px}.gk-container{padding:12px}
  .gk-hud{font-size:11px;padding:6px 9px;flex-wrap:wrap}
  .gk-quest{width:calc(100% - 24px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.gk-regions{position:absolute;inset:0;pointer-events:none;line-height:1}
.gk-region{position:absolute;transform:translate(-50%,-50%);writing-mode:vertical-rl;
  font-family:'Noto Serif SC',serif;font-size:15px;font-weight:900;letter-spacing:.5em;
  color:rgba(42,37,32,.5);text-shadow:0 0 3px rgba(255,249,230,.6)}
@media(max-width:900px){.gk-region{font-size:12px}}
</style>

<script>
(function () {
'use strict';
/* ================= 数据 ================= */
var PLACES = [];
var COLS = 64, ROWS = 44, TILE = 16;
var cv = document.getElementById('gk-canvas');
if (!cv) return;
var ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= 地形烘焙 ================= */
var terrain=document.createElement('canvas');terrain.width=COLS*TILE;terrain.height=ROWS*TILE;
var SOLID={};
function bake(){
  var g=terrain.getContext('2d'),R=rng(20250826),x,y;
  /* 六域种子（瓦片坐标）与各自三色像素调色板 */
  var REG=[
    {n:'西 域',sx:8,sy:10,p:['#C4784A','#B5693C','#D0905E']},
    {n:'漠 北',sx:30,sy:7, p:['#8FA68E','#7E967E','#A0B49E']},
    {n:'中原',sx:34,sy:25,p:['#7FA88F','#6E9980','#93B8A0']},
    {n:'江 南',sx:50,sy:27,p:['#4A7DBF','#3F6DA8','#5E92CC']},
    {n:'岭 南',sx:36,sy:39,p:['#6B8E7B','#5D8070','#7BA08C']},
    {n:'东 海',sx:59,sy:20,p:['#7FA8C4','#6E98B4','#93BAD2']},
  ];
  window.__REG=REG;
  function rid(tx,ty){ /* 最近种子 + 抖动 → 天然锯齿硬边界 */
    var best=0,bd=1e9;
    for(var i=0;i<REG.length;i++){
      var d=Math.abs(tx-REG[i].sx)+Math.abs(ty-REG[i].sy)+R()*3.2;
      if(d<bd){bd=d;best=i;}
    }
    return best;
  }
  var map=[];
  for(y=0;y<ROWS;y++){map[y]=[];for(x=0;x<COLS;x++)map[y][x]=rid(x,y);}
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var pal=REG[map[y][x]].p,v=R();
    var c=v<.6?pal[0]:v<.85?pal[1]:pal[2];
    g.fillStyle=c;g.fillRect(x*TILE,y*TILE,TILE,TILE);
    if(v>.94){g.fillStyle=pal[1];g.fillRect(x*TILE+4,y*TILE+4,3,3);}
  }
  /* 硬边界：相邻异域画深色锯齿缝 */
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(x+1<COLS&&map[y][x]!==map[y][x+1]){g.fillStyle='rgba(42,37,32,.55)';g.fillRect((x+1)*TILE-1,y*TILE,2,TILE);}
    if(y+1<ROWS&&map[y][x]!==map[y+1][x]){g.fillStyle='rgba(42,37,32,.55)';g.fillRect(x*TILE,(y+1)*TILE-1,TILE,2);}
  }
  /* 湖 */
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var dx=(x-10)/14,dy=(y-34)/10;
    if(dx*dx+dy*dy<1){g.fillStyle=(x+y)%3?'#35618F':'#2E5680';g.fillRect(x*TILE,y*TILE,TILE,TILE);SOLID[x+','+y]=1;}
  }
  function tree(px,py,sakura){
    g.fillStyle='#5B4632';g.fillRect(px+6,py+18,4,7);
    if(sakura){g.fillStyle='#F5B8C8';g.fillRect(px,py,16,12);g.fillStyle='#EE9DB4';g.fillRect(px+3,py+2,10,8);g.fillRect(px+6,py-2,6,6);}
    else{g.fillStyle='#3E6B41';g.fillRect(px+1,py+2,14,13);g.fillStyle='#4E7A52';g.fillRect(px+4,py,9,7);}
  }
  for(var i=0;i<40;i++){
    var tx=Math.floor(R()*COLS),ty=Math.floor(R()*ROWS);
    if(SOLID[tx+','+ty])continue;
    var nearNode=PLACES.some(function(p){return Math.abs(Math.floor(p.x/1000*COLS)-tx)<3&&Math.abs(Math.floor(p.y/700*ROWS)-ty)<3});
    if(nearNode)continue;
    tree(tx*TILE,ty*TILE,R()<.3);SOLID[tx+','+ty]=1;
  }
}
function carveNodeClearings(){
  var g=terrain.getContext('2d');
  PLACES.forEach(function(p){
    var cx=Math.floor(p.x/1000*COLS),cy=Math.floor(p.y/700*ROWS);
    delete SOLID[cx+','+cy];
    [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,-1]].forEach(function(d){delete SOLID[(cx+d[0])+','+(cy+d[1])];});
    g.fillStyle=p.visited!==false?'#C9B37E':'#8A8070';
    g.fillRect(cx*TILE,cy*TILE,TILE,TILE);
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(cx*TILE+2,cy*TILE+TILE-3,TILE-4,3);
  });
}

/* ================= 状态 ================= */
var player={tx:0,ty:0,fx:0,fy:0,moving:false,face:1};
var cam={x:0,y:0};
var explored={};
var lastPlace=null;

function nodeTiles(p){return{tx:Math.floor(p.x/1000*COLS),ty:Math.floor(p.y/700*ROWS)}}

/* ================= 绘制循环 ================= */
/* 探索雾：预渲染离屏层，reveal 时局部重绘（避免每帧 2816 次 fillRect） */
var fog=document.createElement('canvas');fog.width=COLS*TILE;fog.height=ROWS*TILE;
var fg=fog.getContext('2d');fg.fillStyle='#141225';fg.fillRect(0,0,fog.width,fog.height);
function clearFog(tx,ty,r){
  fg.clearRect(Math.max(0,(tx-r))*TILE,Math.max(0,(ty-r))*TILE,(r*2+1)*TILE,(r*2+1)*TILE);
}
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  var px=player.fx*TILE,py=player.fy*TILE;
  cam.x=Math.max(0,Math.min(COLS*TILE-cv.width,px-cv.width/2));
  cam.y=Math.max(0,Math.min(ROWS*TILE-cv.height,py-cv.height/2));
  ctx.drawImage(terrain,-cam.x,-cam.y);
  ctx.drawImage(fog,-cam.x,-cam.y);
  /* 节点旗帜 */
  PLACES.forEach(function(p){
    var nt=nodeTiles(p);
    if(!explored[nt.tx+','+nt.ty])return;
    var sx=nt.tx*TILE-cam.x,sy=nt.ty*TILE-cam.y;
    var lit=p.visited!==false;
    ctx.fillStyle='#5B4632';ctx.fillRect(sx+7,sy-6,2,16);
    ctx.fillStyle=lit?'#E86B8A':'#8A8090';
    ctx.fillRect(sx+9,sy-6,lit?10:7,7);
    if(lit){ctx.fillStyle='#FFD9E3';ctx.fillRect(sx+11,sy-4,3,3);}
  });
  /* 玩家（两帧小步动画） */
  var bob=(Math.floor(t/140)%2===0)?1:0;
  var sx=player.fx*TILE-cam.x,sy=player.fy*TILE-cam.y-bob;
  ctx.fillStyle='#2A2440';ctx.fillRect(sx+3,sy+1,10,3);
  ctx.fillStyle='#F0C8A0';ctx.fillRect(sx+4,sy+4,8,4);
  ctx.fillStyle= player.face<0?'#7FA8C4':'#C9556E';
  ctx.fillRect(sx+2,sy+8,12,7);
  ctx.fillStyle='#3A3454';ctx.fillRect(sx+4,sy+15,3,4);ctx.fillRect(sx+9,sy+15,3,4);
  requestAnimationFrame(draw);
}

/* ================= 移动 ================= */
function tryStep(dx,dy){
  if(player.moving)return;
  var nx=player.tx+dx,ny=player.ty+dy;
  if(dx)player.face=dx;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS||SOLID[nx+','+ny])return;
  stepTo(nx,ny);
}
function stepTo(nx,ny){
  player.tx=nx;player.ty=ny;
  var t0=performance.now(),fx0=player.fx,fy0=player.fy;
  player.moving=true;
  (function anim(now){
    var k=Math.min(1,(now-t0)/140);
    player.fx=fx0+(nx-fx0)*k;player.fy=fy0+(ny-fy0)*k;
    if(k<1)requestAnimationFrame(anim);
    else{player.moving=false;revealAround(nx,ny,2);arriveCheck();}
  })(t0);
}
function bfs(sx,sy,tx,ty){
  var q=[[sx,sy]],prev={},seen={};seen[sx+','+sy]=1;
  while(q.length){
    var cur=q.shift();
    if(cur[0]===tx&&cur[1]===ty){
      var path=[],k=tx+','+ty;
      while(k!==sx+','+sy&&prev[k]){path.unshift(k.split(',').map(Number));k=prev[k];}
      return path;
    }
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nk=(cur[0]+d[0])+','+(cur[1]+d[1]);
      if(!seen[nk]&&!SOLID[nk]){seen[nk]=1;prev[nk]=cur.join(',');q.push([cur[0]+d[0],cur[1]+d[1]]);}
    });
  }
  return null;
}
function walkPath(path){
  if(player.moving||!path||!path.length)return;
  player.moving=true;(function next(){
    var n=path.shift();
    if(!n){player.moving=false;revealAround(player.tx,player.ty,2);arriveCheck();return;}
    if(n[0]!==player.tx)player.face=n[0]-player.tx;
    var t0=performance.now(),fx0=player.fx,fy0=player.fy;
    (function anim(now){
      var k=Math.min(1,(now-t0)/120);
      player.fx=fx0+(n[0]-fx0)*k;player.fy=fy0+(n[1]-fy0)*k;
      if(k<1)requestAnimationFrame(anim);else next();
    })(t0);
  })();
}

/* ================= 探索与诗笺 ================= */
function revealAround(tx,ty,r){
  for(var y=ty-r;y<=ty+r;y++)for(var x=tx-r;x<=tx+r;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;
    explored[x+','+y]=1;
  }
  clearFog(tx,ty,r);
  refreshCounters();renderLabels();
}
function refreshCounters(){
  var lit=PLACES.filter(function(p){return p.visited!==false}).length;
  document.getElementById('gk-count').textContent=lit;
  document.getElementById('gk-total').textContent=PLACES.length;
}
function arriveCheck(){
  PLACES.forEach(function(p){
    var nt=nodeTiles(p);
    if(nt.tx===player.tx&&nt.ty===player.ty)openQuest(p);
  });
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function openQuest(p){
  document.getElementById('gk-q-place').textContent=p.visited!==false?p.name:'？？？';
  document.getElementById('gk-q-title').textContent=p.visited!==false?(p.poemTitle||'行迹'):'迷 雾 之 外';
  document.getElementById('gk-q-date').textContent=p.visited!==false?('✿ '+(p.date||'')):'尚未抵达的远方';
  document.getElementById('gk-q-poem').textContent=p.visited!==false?(p.poem||'（还没有落下诗句）'):'那里的故事还没发生。\n总有一天，我会带着新的诗句站上这片土地。';
  document.getElementById('gk-q-note').textContent=p.visited!==false?(p.note||''):('目的地：'+esc(p.name));
  var q=document.getElementById('gk-quest');
  q.classList.add('show');q.setAttribute('aria-hidden','false');
}
function closeQuest(){var q=document.getElementById('gk-quest');q.classList.remove('show');q.setAttribute('aria-hidden','true');}

/* ================= 节点铭牌 ================= */
function renderLabels(){
  var box=document.getElementById('gk-labels');box.innerHTML='';
  PLACES.forEach(function(p){
    var nt=nodeTiles(p);
    if(!explored[nt.tx+','+nt.ty])return;
    var d=document.createElement('div');
    d.className='gk-label'+((p.visited!==false)?'':' unreached');
    d.style.left=((nt.tx+0.5)/COLS*100)+'%';
    d.style.top=(nt.ty/ROWS*100)+'%';
    d.textContent=p.name;
    box.appendChild(d);
  });
}

/* ================= 输入 ================= */
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(['w','arrowup'].indexOf(k)>=0){tryStep(0,-1);e.preventDefault();}
  else if(['s','arrowdown'].indexOf(k)>=0){tryStep(0,1);e.preventDefault();}
  else if(['a','arrowleft'].indexOf(k)>=0){tryStep(-1,0);e.preventDefault();}
  else if(['d','arrowright'].indexOf(k)>=0){tryStep(1,0);e.preventDefault();}
  else if(k==='e'){openNearest();}
  else if(k==='escape')closeQuest();
});
cv.addEventListener('click',function(e){
  var rect=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-rect.left)/rect.width*COLS);
  var y=Math.floor((e.clientY-rect.top)/rect.height*ROWS);
  if(x<0||y<0||x>=COLS||y>=ROWS||SOLID[x+','+y])return;
  var path=bfs(player.tx,player.ty,x,y);
  if(path)walkPath(path);
});
function openNearest(){
  var best=null,bd=1e9;
  PLACES.forEach(function(p){
    if(p.visited===false)return;
    var nt=nodeTiles(p);
    var d=Math.abs(nt.tx-player.tx)+Math.abs(nt.ty-player.ty);
    if(d<bd){bd=d;best=p;}
  });
  if(best&&bd<=3)openQuest(best);
}

/* ================= 启动 ================= */
fetch('/data/places.json')
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(list){
    PLACES=list||[];
    bake();carveNodeClearings();
    var home=PLACES.filter(function(p){return p.visited!==false})[0]||PLACES[0];
    var ht=nodeTiles(home);
    player.tx=ht.tx;player.ty=ht.ty;player.fx=ht.tx;player.fy=ht.ty;
    PLACES.forEach(function(p){if(p.visited!==false){var nt=nodeTiles(p);revealAround(nt.tx,nt.ty,4);}});
    revealAround(player.tx,player.ty,3);
    refreshCounters();renderLabels();
    var rg=document.getElementById('gk-regions');
    (window.__REG||[]).forEach(function(r){
      var d=document.createElement('div');d.className='gk-region';
      d.style.left=((r.sx+0.5)/COLS*100)+'%';d.style.top=((r.sy+2)/ROWS*100)+'%';
      d.textContent=r.n.replace(/s/g,'');rg.appendChild(d);
    });
    requestAnimationFrame(draw);
  })
  .catch(function(e){
    console.error(e);
    document.getElementById('gk-frame').insertAdjacentHTML('beforeend',
      '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#EDE7FF;font-size:14px">数据加载失败，请刷新重试</div>');
  });
})();
</script>
