<!-- ============ 行迹 · 水彩国风可缩放地图（Venus × paper-reading-blog 自绘SVG规范；布局对齐 SHARED_LAYOUT_SPEC v1；性能版：无大滤镜/rAF合帧/contain） ============ -->
<div class="mp-page">
  <div class="mp-band" aria-hidden="true"></div>
  <div class="mp-corner mp-corner-tl" aria-hidden="true"></div>
  <div class="mp-corner mp-corner-br" aria-hidden="true"></div>

  <div class="container mp-container">
    <header class="mp-hero">
      <span class="mp-badge">行迹 · TRAVELED INK</span>
      <h1 class="mp-title">山河行迹图</h1>
      <p class="mp-hand">走过的每一处，都亮着一盏灯</p>
      <p class="mp-hint">滚轮缩放 · 拖拽平移 · 点击点亮之地读诗</p>
    </header>

    <!-- 地图视口（主内容区） -->
    <div class="mp-viewport" id="mp-viewport">
      <div class="mp-canvas" id="mp-canvas">
        <svg id="mp-svg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" aria-label="水彩国风行迹地图">
          <defs>
            <!-- 小范围水墨皴笔模糊（细线条，开销极小，保留） -->
            <filter id="mp-ink" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.1"/>
            </filter>
            <!-- 水彩晕染底改用 radialGradient 预烘焙（原大范围高斯模糊滤镜已移除，绘制成本趋零） -->
            <radialGradient id="mp-wash-a"><stop offset="0" stop-color="#C4784A" stop-opacity=".52"/><stop offset=".62" stop-color="#C4784A" stop-opacity=".20"/><stop offset="1" stop-color="#C4784A" stop-opacity="0"/></radialGradient>
            <radialGradient id="mp-wash-b"><stop offset="0" stop-color="#8FA68E" stop-opacity=".50"/><stop offset=".62" stop-color="#8FA68E" stop-opacity=".19"/><stop offset="1" stop-color="#8FA68E" stop-opacity="0"/></radialGradient>
            <radialGradient id="mp-wash-c"><stop offset="0" stop-color="#7FA88F" stop-opacity=".52"/><stop offset=".62" stop-color="#7FA88F" stop-opacity=".20"/><stop offset="1" stop-color="#7FA88F" stop-opacity="0"/></radialGradient>
            <radialGradient id="mp-wash-d"><stop offset="0" stop-color="#4A7DBF" stop-opacity=".50"/><stop offset=".62" stop-color="#4A7DBF" stop-opacity=".19"/><stop offset="1" stop-color="#4A7DBF" stop-opacity="0"/></radialGradient>
            <radialGradient id="mp-wash-e"><stop offset="0" stop-color="#6B8E7B" stop-opacity=".50"/><stop offset=".62" stop-color="#6B8E7B" stop-opacity=".19"/><stop offset="1" stop-color="#6B8E7B" stop-opacity="0"/></radialGradient>
            <radialGradient id="mp-wash-f"><stop offset="0" stop-color="#7FA8C4" stop-opacity=".48"/><stop offset=".62" stop-color="#7FA8C4" stop-opacity=".18"/><stop offset="1" stop-color="#7FA8C4" stop-opacity="0"/></radialGradient>
          </defs>

          <!-- 水彩晕染底：西漠赭石 · 漠北草色 · 中原青绿 · 江南花青 · 岭南苍绿 · 东海水色 -->
          <g opacity=".82">
            <ellipse cx="250" cy="180" rx="190" ry="120" fill="url(#mp-wash-a)"/>
            <ellipse cx="560" cy="150" rx="170" ry="100" fill="url(#mp-wash-b)"/>
            <ellipse cx="640" cy="400" rx="200" ry="130" fill="url(#mp-wash-c)"/>
            <ellipse cx="800" cy="470" rx="150" ry="110" fill="url(#mp-wash-d)"/>
            <ellipse cx="430" cy="560" rx="160" ry="100" fill="url(#mp-wash-e)"/>
            <ellipse cx="950" cy="350" rx="90"  ry="220" fill="url(#mp-wash-f)"/>
          </g>

          <!-- 山脉（水墨皴笔） -->
          <g filter="url(#mp-ink)" opacity=".5" stroke="#2D2D2D" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path d="M180 240 l26 -44 22 40 20 -30 24 42"/>
            <path d="M255 205 l20 -34 18 30 18 -24 20 36"/>
            <path d="M330 300 l22 -38 20 34 18 -26 22 38"/>
            <path d="M300 520 l24 -40 20 36 20 -28 22 40"/>
            <path d="M560 560 l22 -36 20 32 18 -24 20 34"/>
            <path d="M120 420 l22 -36 20 32 18 -24 20 34"/>
          </g>

          <!-- 江河（花青双钩） -->
          <g filter="url(#mp-ink)" fill="none" stroke="#4A7DBF" opacity=".55">
            <path d="M60 250 C 220 230, 330 300, 470 280 S 720 240, 900 300" stroke-width="7" opacity=".5"/>
            <path d="M380 640 C 460 560, 520 520, 610 470 S 780 430, 960 430" stroke-width="9" opacity=".55"/>
          </g>

          <!-- 区域题字（竖排） -->
          <g font-family="'Noto Serif SC',serif" fill="#4A4A4A" opacity=".62" font-size="19" letter-spacing="4">
            <text x="215" y="120" writing-mode="tb">西 域</text>
            <text x="560" y="80"  writing-mode="tb">漠 北</text>
            <text x="640" y="300" writing-mode="tb">中 原</text>
            <text x="805" y="360" writing-mode="tb">江 南</text>
            <text x="435" y="500" writing-mode="tb">西南</text>
            <text x="705" y="545" writing-mode="tb">岭 南</text>
            <text x="940" y="180" writing-mode="tb">东海</text>
          </g>

          <!-- 地点层（JS 注入） -->
          <g id="mp-spots"></g>
        </svg>
      </div>

      <!-- 罗盘饰件（视口左上，低透明度，不参与平移缩放） -->
      <svg class="mp-compass" viewBox="0 0 64 72" aria-hidden="true">
        <circle cx="32" cy="38" r="25" fill="none" stroke="#8B4570" stroke-width="1.2" opacity=".5"/>
        <circle cx="32" cy="38" r="20.5" fill="none" stroke="#C9A86C" stroke-width=".8" opacity=".5"/>
        <path d="M32 17 L35.6 38 L32 35.6 L28.4 38 Z" fill="#E86B8A" opacity=".85"/>
        <path d="M32 59 L35.6 38 L32 40.4 L28.4 38 Z" fill="#8B4570" opacity=".5"/>
        <circle cx="32" cy="38" r="2" fill="#FDFAF2" stroke="#8B4570" stroke-width=".8" opacity=".8"/>
        <text x="32" y="10" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9.5" fill="#8B4570" opacity=".85">N</text>
      </svg>

      <!-- 视口四角细角框饰件 -->
      <span class="vp-corner vp-corner-tl" aria-hidden="true"></span>
      <span class="vp-corner vp-corner-tr" aria-hidden="true"></span>
      <span class="vp-corner vp-corner-bl" aria-hidden="true"></span>
      <span class="vp-corner vp-corner-br" aria-hidden="true"></span>

      <!-- 缩放控件（HUD 竖排胶囊组） -->
      <div class="mp-ctrl">
        <button id="mp-zin"  title="放大" aria-label="放大">＋</button>
        <button id="mp-zout" title="缩小" aria-label="缩小">－</button>
        <button id="mp-zreset" title="复位" aria-label="复位">◎</button>
      </div>
      <div class="mp-legend">
        <span class="mp-dot lit"></span> 已点亮 · 有诗
        <span class="mp-dot dim"></span> 未至
      </div>
    </div>

    <footer class="mp-foot">
      <div class="mp-brandline" aria-hidden="true"></div>
      <p>此卷山河，随行迹徐徐展开</p>
    </footer>
  </div>
</div>

<!-- 诗笺弹层 -->
<div class="mp-mask" id="mp-mask">
  <div class="mp-poem-card" role="dialog" aria-modal="true">
    <button class="mp-poem-close" id="mp-poem-close" aria-label="关闭">✕</button>
    <div class="mp-poem-strip" id="mp-poem-strip">行迹</div>
    <div class="mp-poem-body">
      <h3 id="mp-poem-place">—</h3>
      <p class="mp-poem-date" id="mp-poem-date">—</p>
      <div class="mp-poem-lines" id="mp-poem-lines">—</div>
      <p class="mp-poem-note" id="mp-poem-note"></p>
    </div>
    <span class="mp-poem-seal" aria-hidden="true">迹</span>
  </div>
</div>

<style>
/* ===== 行迹 · 水彩国风 —— 布局对齐全站骨架（SHARED_LAYOUT_SPEC v1） ===== */
/* 骨架槽位：外层 100vh+padding20 / 内容列 max-width1200 居中+padding20 / 断点 900 */
.mp-page {
  position:relative; min-height:100vh; padding:20px;
}
.container.mp-container {
  position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:20px;
  /* 本页画布皮肤（暖纸底，贴合站点艺术气质） */
  background:
    radial-gradient(800px 300px at 10% 0%, rgba(90,143,123,.07), transparent 60%),
    linear-gradient(#FBF9F3, #F5F0E5);
  border:1px solid #E8DFD0; border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);
  font-family:'Noto Sans SC',-apple-system,sans-serif; color:#2A2520;
}
.mp-band {
  position:absolute; top:0; left:0; right:0; height:9px; opacity:.85; border-radius:20px 20px 0 0;
  background:linear-gradient(90deg,#4A3F2F 0 30%, #7A6B52 30% 55%, #C4784A 55% 80%, #4A7DBF 80% 100%);
  background-size:72px 100%;
}
.mp-corner { position:absolute; width:52px; height:52px; pointer-events:none; z-index:3; }
.mp-corner::before { content:''; position:absolute; inset:0; border:2px solid #4A3F2F; opacity:.38; }
.mp-corner::after  { content:''; position:absolute; inset:5px; border:1px solid #C4784A; opacity:.5; }
.mp-corner-tl { top:20px; left:20px; } .mp-corner-tl::before,.mp-corner-tl::after { border-right:0; border-bottom:0; }
.mp-corner-br { bottom:20px; right:20px; } .mp-corner-br::before,.mp-corner-br::after { border-left:0; border-top:0; }

.mp-hero { position:relative; z-index:1; text-align:center; padding:.4rem 1rem 1.6rem; }
.mp-badge {
  display:inline-block; font-family:'JetBrains Mono',monospace; font-size:.68rem;
  letter-spacing:.4em; color:#C4784A; border:1px solid #C4784A; border-radius:999px;
  padding:.28rem 1rem .24rem 1.25rem; margin-bottom:.85rem; opacity:.9;
}
.mp-title {
  font-family:'Noto Serif SC',serif; font-weight:900; letter-spacing:.2em;
  font-size:clamp(1.9rem,4.4vw,2.8rem); margin:0 0 .55rem; color:#2A2520;
}
.mp-hand { font-family:'Ma Shan Zheng',cursive; font-size:1.18rem; color:#4A3F2F; margin:0 0 .4rem; }
.mp-hint { font-size:.8rem; color:#9A8E80; margin:0; letter-spacing:.06em; }

/* 视口与画布：contain:strict 隔离重排/重绘 */
.mp-viewport {
  position:relative; z-index:1; border:1px solid #E8DFD0; border-radius:14px;
  background:linear-gradient(#FDFAF2,#F7F1E3);
  overflow:hidden; height:520px; cursor:grab; touch-action:none;
  box-shadow:inset 0 0 40px rgba(74,63,47,.06);
  contain:strict;
}
.mp-viewport:active { cursor:grabbing; }
.mp-canvas { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
#mp-svg { width:100%; height:100%; display:block; }

/* 罗盘饰件（左上，低透明度） */
.mp-compass {
  position:absolute; top:12px; left:12px; width:56px; height:63px;
  opacity:.55; pointer-events:none; z-index:2;
}

/* 视口四角角框：2px 外框（梅紫）+ 内缩 1px 内框（樱粉） */
.vp-corner { position:absolute; width:26px; height:26px; pointer-events:none; z-index:3; }
.vp-corner::before { content:''; position:absolute; inset:0; border:2px solid #8B4570; opacity:.65; }
.vp-corner::after  { content:''; position:absolute; inset:3px; border:1px solid #E86B8A; opacity:.6; }
.vp-corner-tl { top:8px; left:8px; }  .vp-corner-tl::before,.vp-corner-tl::after { border-right:0; border-bottom:0; }
.vp-corner-tr { top:8px; right:8px; } .vp-corner-tr::before,.vp-corner-tr::after { border-left:0; border-bottom:0; }
.vp-corner-bl { bottom:8px; left:8px; }  .vp-corner-bl::before,.vp-corner-bl::after { border-right:0; border-top:0; }
.vp-corner-br { bottom:8px; right:8px; } .vp-corner-br::before,.vp-corner-br::after { border-left:0; border-top:0; }

/* 地点标记：核心圆 + 呼吸光环 + 底部三角指针；hover/按下有 scale 反馈 */
.mp-spot { cursor:pointer; outline:none; }
.mp-spot .halo { fill:#E86B8A; opacity:.12; }              /* 无滤镜软底圈 */
.mp-spot .ring { fill:none; stroke:#E86B8A; stroke-width:1.5; opacity:.38; }  /* 预烘焙双圈描边外环 */
.mp-spot .tip { fill:#E86B8A; opacity:.9; }
.mp-spot .core { fill:#E86B8A; stroke:#FFFDF6; stroke-width:2; }
.mp-spot .glint { fill:#FFFDF6; opacity:.85; }
.mp-spot .pin {
  transform-box:fill-box; transform-origin:center;
  transition:transform .18s ease-in-out;
}
.mp-spot:hover .pin, .mp-spot:focus-visible .pin { transform:scale(1.35); }
.mp-spot:active .pin { transform:scale(1.15); }
.mp-spot.lit .pulse {
  fill:none; stroke:#E86B8A; stroke-width:1.5;
  animation:mp-pulse 2.4s ease-out infinite;
  transform-box:fill-box; transform-origin:center;
  will-change:transform,opacity;
}
@keyframes mp-pulse { 0%{opacity:.55; transform:scale(.6)} 70%{opacity:0; transform:scale(2.1)} 100%{opacity:0} }
.mp-spots--paused .pulse { animation-play-state:paused; }   /* document.hidden 时经 visibilitychange 暂停 */
.mp-spot .label {
  font-family:'Noto Serif SC',serif; font-size:15px; fill:#4A3F2F;
  paint-order:stroke; stroke:#FDFAF2; stroke-width:4px; letter-spacing:2px;
  pointer-events:none;
}
.mp-spot.ghost .halo { fill:#B8AA96; opacity:.08; }
.mp-spot.ghost .ring { display:none; }
.mp-spot.ghost .tip { fill:#B8AA96; opacity:.4; }
.mp-spot.ghost .core { fill:#B8AA96; opacity:.55; stroke:#F5F0E5; }
.mp-spot.ghost .glint { opacity:0; }
.mp-spot.ghost:hover .pin, .mp-spot.ghost:focus-visible .pin { transform:scale(1.25); }
.mp-spot.ghost .label { fill:#A89A86; }

/* 缩放控件：HUD 毛玻璃竖排胶囊组，细金边，置于右下 */
.mp-ctrl {
  position:absolute; right:14px; bottom:14px; z-index:3;
  display:flex; flex-direction:column; gap:4px; padding:5px;
  background:rgba(253,250,242,.55);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);
  backdrop-filter:blur(10px) saturate(1.15);
  border:1px solid rgba(201,168,108,.85); border-radius:999px;
  box-shadow:0 4px 14px rgba(74,63,47,.16);
}
.mp-ctrl button {
  width:34px; height:34px; border-radius:50%; border:0; background:transparent;
  color:#6B5B45; font-size:1rem; cursor:pointer; font-family:'Noto Serif SC',serif;
  display:grid; place-items:center; padding:0;
  transition:background .2s ease-in-out, color .2s ease-in-out, transform .15s ease-in-out,
             box-shadow .2s ease-in-out;
}
.mp-ctrl button:hover { background:rgba(232,107,138,.15); color:#8B4570; box-shadow:0 0 0 1px rgba(201,168,108,.6) inset; }
.mp-ctrl button:active { transform:scale(.9); }
.mp-ctrl button:focus-visible { outline:1px solid #C9A86C; outline-offset:1px; }

.mp-legend {
  position:absolute; left:14px; bottom:14px; z-index:2;
  background:rgba(253,250,242,.66);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(201,168,108,.5); border-radius:999px;
  font-size:.76rem; color:#6A5F50; padding:.4rem .8rem;
  display:flex; align-items:center; gap:.45rem;
}
.mp-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.mp-dot.lit { background:#E86B8A; box-shadow:0 0 0 2px #FDFAF2, 0 0 0 3px rgba(232,107,138,.4); }
.mp-dot.dim { background:#B8AA96; margin-left:.6rem; }

/* 诗笺弹层：200ms 缓入缓出开合 */
.mp-mask {
  position:fixed; inset:0; background:rgba(42,37,32,.45);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);

.mp-poem-card {

<script>
(function () {
  'use strict';
  var viewport = document.getElementById('mp-viewport');
  var canvas = document.getElementById('mp-canvas');
  if (!viewport || !canvas) return;

  /* ---------- 数据（places.json 契约不变：name/x/y/visited/date/poem/poemTitle/note） ---------- */
  fetch('/data/places.json')
    .then(function (r) { return r.json(); })
    .then(function (places) { renderSpots(places || []); })
    .catch(function (e) { console.error('places.json 加载失败', e); });
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function renderSpots(places) {
    var layer = document.getElementById('mp-spots');
    if (!layer) return;
    layer.innerHTML = places.map(function (p, i) {
      var lit = p.visited !== false;
      return '<g class="mp-spot ' + (lit ? 'lit' : 'ghost') + '" data-i="' + i + '" tabindex="0" role="button" aria-label="' + esc(p.name) + '">' +
        '<circle class="halo" cx="' + p.x + '" cy="' + p.y + '" r="10"/>' +
        (lit ? '<circle class="pulse" cx="' + p.x + '" cy="' + p.y + '" r="12"/>' +
               '<circle class="ring" cx="' + p.x + '" cy="' + p.y + '" r="9"/>' : '') +
        '<g class="pin">' +
          '<path class="tip" d="M' + (p.x - 4) + ' ' + (p.y + 7.5) + ' L' + p.x + ' ' + (p.y + 15) + ' L' + (p.x + 4) + ' ' + (p.y + 7.5) + ' Z"/>' +
          '<circle class="core" cx="' + p.x + '" cy="' + p.y + '" r="5.5"/>' +
          (lit ? '<circle class="glint" cx="' + (p.x - 1.6) + '" cy="' + (p.y - 1.6) + '" r="1.4"/>' : '') +
        '</g>' +
        '<text class="label" x="' + (p.x + 13) + '" y="' + (p.y + 5) + '">' + esc(p.name) + '</text>' +
        '</g>';
    }).join('');
    Array.prototype.forEach.call(layer.querySelectorAll('.mp-spot'), function (node) {
      node.addEventListener('click', function () { openPoem(places[+this.getAttribute('data-i')]); });
      node.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPoem(places[+this.getAttribute('data-i')]); }
      });
    });
    syncPulsePaused();
  }

  /* 呼吸光环：页面不可见时暂停（visibilitychange），可见时恢复 */
  function syncPulsePaused() {
    var layer = document.getElementById('mp-spots');
    if (layer) layer.classList.toggle('mp-spots--paused', document.hidden);
  }
  document.addEventListener('visibilitychange', syncPulsePaused);

  /* ---------- 诗笺（文案结构不变） ---------- */
  function openPoem(p) {
    if (!p) return;
    document.getElementById('mp-poem-place').textContent = p.name || '—';
    document.getElementById('mp-poem-strip').textContent = (p.poemTitle || '行迹').split('').join(' ');
    document.getElementById('mp-poem-date').textContent = p.date ? '✿ ' + p.date : '';
    document.getElementById('mp-poem-lines').textContent = p.poem || '（此处还没有落下诗句）';
    document.getElementById('mp-poem-note').textContent = p.note || '';
    document.getElementById('mp-mask').classList.add('show');
  }
  document.getElementById('mp-poem-close').addEventListener('click', function () {
    document.getElementById('mp-mask').classList.remove('show');
  });
  document.getElementById('mp-mask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('mp-mask').classList.remove('show');
  });

  /* ---------- 缩放与平移（rAF 合帧：状态即时更新，绘制每帧最多一次） ---------- */
  var scale = 1, tx = 0, ty = 0, MIN = 1, MAX = 4;
  var applyScheduled = false;
  function apply() {
    /* transform 仅用 translate/scale */
    canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }
  function scheduleApply() {
    if (applyScheduled) return;
    applyScheduled = true;
    requestAnimationFrame(function () {
      applyScheduled = false;
      clampPan();
      apply();
    });
  }
  function zoomAt(cx, cy, factor) {
    var ns = Math.min(MAX, Math.max(MIN, scale * factor));
    if (ns === scale) return;
    var rect = viewport.getBoundingClientRect();
    var px = cx - rect.left, py = cy - rect.top;
    tx = px - (px - tx) * (ns / scale);
    ty = py - (py - ty) * (ns / scale);
    scale = ns;
    scheduleApply();
  }
  function clampPan() {
    var rect = viewport.getBoundingClientRect();
    var minX = rect.width - rect.width * scale, minY = rect.height - rect.height * scale;
    tx = Math.min(0, Math.max(minX, tx));
    ty = Math.min(0, Math.max(minY, ty));
  }
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0, mx = 0, my = 0;
  viewport.addEventListener('pointerdown', function (e) {
    dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty; mx = sx; my = sy;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    mx = e.clientX; my = e.clientY;           /* 只记录最新坐标 */
    scheduleApply();                           /* 绘制交给 rAF 合帧 */
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    viewport.addEventListener(ev, function () { dragging = false; });
  });
  document.getElementById('mp-zin').addEventListener('click', function () {
    var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.3);
  });
  document.getElementById('mp-zout').addEventListener('click', function () {
    var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.3);
  });
  document.getElementById('mp-zreset').addEventListener('click', function () {
    scale = 1; tx = 0; ty = 0; scheduleApply();
  });
})();
</script>
