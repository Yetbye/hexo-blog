<!-- ============ 行迹 · 中世纪手绘中国地图（真实 GeoJSON + 钢笔线描） ============ -->
<div class="gm-page">
  <div class="gm-container">
    <header class="gm-hero">
      <span class="gm-eyebrow">TRAVEL · MAPPA · MUNDI</span>
      <h1 class="gm-title">行 迹</h1>
      <p class="gm-hand">走过的路，写在地图上；写下的诗，刻进山河里</p>
      <span class="gm-chip">✿ 已走过 <b id="gm-count">0</b> 座城</span>
    </header>

    <div class="gm-map-frame">
      <svg id="gm-map" class="gm-map" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- 手绘线条：湍流扰动边缘 -->
          <filter id="ink-pen" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="7" result="wobble"/>
            <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="ink-pen-thin">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="w"/>
            <feDisplacementMap in="SourceGraphic" in2="w" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <!-- 老旧羊皮纸 -->
          <filter id="parchment">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
            <feColorMatrix in="n" values="0 0 0 0 0.78  0 0 0 0 0.69  0 0 0 0 0.51  0 0 0 0.18 0" result="tint"/>
            <feComposite in="tint" in2="SourceGraphic" operator="in" result="masked"/>
            <feBlend in="SourceGraphic" in2="masked" mode="multiply"/>
          </filter>
          <!-- 海浪短线 -->
          <pattern id="wave-pattern" x="0" y="0" width="14" height="8" patternUnits="userSpaceOnUse">
            <path d="M 0 4 Q 3.5 0 7 4 T 14 4" stroke="#4A6E8F" stroke-width="0.6" fill="none" opacity="0.5"/>
          </pattern>
          <!-- 城市印章 -->
          <filter id="stamp">
            <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
          </filter>
          <!-- 轨迹虚线箭头 -->
          <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M 0 1 L 11 4 L 0 7 L 3 4 Z" fill="#7A2F3F"/>
          </marker>
        </defs>

        <!-- 羊皮纸底（含粗布纤维） -->
        <rect width="1000" height="760" fill="#F2E7C8"/>
        <rect width="1000" height="760" fill="#E8D9A6" filter="url(#parchment)"/>
        <!-- 纤维斑点 -->
        <g opacity="0.12" fill="#8B6F3F">
          <circle cx="120" cy="80" r="0.7"/><circle cx="250" cy="160" r="0.6"/><circle cx="380" cy="240" r="0.5"/>
          <circle cx="500" cy="120" r="0.7"/><circle cx="640" cy="280" r="0.6"/><circle cx="780" cy="200" r="0.5"/>
          <circle cx="180" cy="420" r="0.6"/><circle cx="320" cy="500" r="0.7"/><circle cx="460" cy="380" r="0.5"/>
          <circle cx="600" cy="460" r="0.6"/><circle cx="740" cy="540" r="0.7"/><circle cx="880" cy="380" r="0.5"/>
          <circle cx="280" cy="640" r="0.6"/><circle cx="450" cy="680" r="0.5"/><circle cx="620" cy="700" r="0.6"/>
          <circle cx="800" cy="660" r="0.7"/><circle cx="920" cy="580" r="0.5"/>
        </g>

        <!-- ===== 中国轮廓（钢笔手绘，墨水深褐） ===== -->
        <g id="china-layer" fill="#E8D9A6" stroke="#3D2914" stroke-width="1.2" fill-opacity="0.55" filter="url(#ink-pen)"></g>

        <!-- 海洋（水波纹 + 灰蓝） -->
        <g id="sea-layer"></g>

        <!-- 海洋装饰：东海章鱼 -->
        <g id="kraken" transform="translate(870, 380)" filter="url(#ink-pen-thin)" opacity="0.55">
          <ellipse cx="0" cy="0" rx="32" ry="26" fill="none" stroke="#3D4F6B" stroke-width="1.4"/>
          <path d="M -22 22 Q -32 46 -22 64 M -10 26 Q -14 50 -4 68 M 4 26 Q 4 52 10 68 M 18 24 Q 24 48 32 60" fill="none" stroke="#3D4F6B" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M -22 22 Q -32 46 -22 64 M -10 26 Q -14 50 -4 68" fill="none" stroke="#3D4F6B" stroke-width="1.3" stroke-linecap="round" transform="scale(-1 1)"/>
          <circle cx="-10" cy="-8" r="3" fill="#3D4F6B"/>
          <circle cx="10" cy="-8" r="3" fill="#3D4F6B"/>
          <text x="0" y="80" font-family="'Ma Shan Zheng',cursive" font-size="11" fill="#3D4F6B" text-anchor="middle">东海之章</text>
        </g>

        <!-- 海洋装饰：南海帆船 -->
        <g id="sailboat" transform="translate(750, 640) rotate(15)" filter="url(#ink-pen-thin)" opacity="0.5">
          <path d="M 0 0 L 18 0 L 8 -25 Z" fill="#C4A36F" stroke="#3D2914" stroke-width="0.8"/>
          <line x1="9" y1="-25" x2="9" y2="2" stroke="#3D2914" stroke-width="0.8"/>
          <path d="M 9 -22 Q 20 -12 9 -2" fill="#E86B8A" stroke="#3D2914" stroke-width="0.6" opacity="0.7"/>
          <path d="M -15 6 Q 0 14 30 6" fill="none" stroke="#3D2914" stroke-width="0.8"/>
          <text x="0" y="22" font-family="'Ma Shan Zheng',cursive" font-size="10" fill="#3D2914" text-anchor="middle">南海商帆</text>
        </g>

        <!-- 陆上装饰：西北骆驼 -->
        <g id="camel" transform="translate(280, 230)" filter="url(#ink-pen-thin)" opacity="0.5">
          <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#7A4E2A" stroke-width="1.2"/>
          <path d="M -20 -6 Q -28 -16 -22 -22" fill="none" stroke="#7A4E2A" stroke-width="1.2"/>
          <line x1="-8" y1="10" x2="-10" y2="22" stroke="#7A4E2A" stroke-width="1"/>
          <line x1="8" y1="10" x2="10" y2="22" stroke="#7A4E2A" stroke-width="1"/>
          <text x="0" y="38" font-family="'Ma Shan Zheng',cursive" font-size="10" fill="#7A4E2A" text-anchor="middle">丝绸之驿</text>
        </g>

        <!-- 陆上装饰：青藏牦牛 -->
        <g id="yak" transform="translate(200, 380)" filter="url(#ink-pen-thin)" opacity="0.5">
          <ellipse cx="0" cy="0" rx="22" ry="12" fill="#3D2914"/>
          <path d="M -18 -8 Q -30 -22 -20 -30" fill="none" stroke="#3D2914" stroke-width="1.4"/>
          <path d="M 18 -8 Q 30 -22 20 -30" fill="none" stroke="#3D2914" stroke-width="1.4"/>
          <text x="0" y="28" font-family="'Ma Shan Zheng',cursive" font-size="10" fill="#3D2914" text-anchor="middle">高原牧歌</text>
        </g>

        <!-- 陆上装饰：江南垂柳 -->
        <g id="willow" transform="translate(770, 360)" filter="url(#ink-pen-thin)" opacity="0.4">
          <path d="M 0 -25 Q -3 -10 -2 5 M 0 -25 Q 4 -10 3 5 M 0 -25 Q 0 -10 0 5" fill="none" stroke="#5A7B4E" stroke-width="1.2"/>
          <circle cx="0" cy="-26" r="6" fill="none" stroke="#5A7B4E" stroke-width="1.2"/>
        </g>

        <!-- 轨迹连线（按时间顺序） -->
        <g id="trajectory" filter="url(#ink-pen-thin)"></g>

        <!-- 城市标记层 -->
        <g id="city-markers"></g>

        <!-- 比例尺（中世纪风） -->
        <g transform="translate(60, 720)" opacity="0.7">
          <line x1="0" y1="0" x2="140" y2="0" stroke="#3D2914" stroke-width="1.5"/>
          <line x1="0" y1="-6" x2="0" y2="6" stroke="#3D2914" stroke-width="1.5"/>
          <line x1="70" y1="-4" x2="70" y2="4" stroke="#3D2914" stroke-width="1"/>
          <line x1="140" y1="-6" x2="140" y2="6" stroke="#3D2914" stroke-width="1.5"/>
          <text x="70" y="20" font-family="'Noto Serif SC',serif" font-size="10" fill="#3D2914" text-anchor="middle">500 KM</text>
          <text x="0" y="-10" font-family="'Noto Sans SC',sans-serif" font-size="8" fill="#3D2914" text-anchor="middle">0</text>
          <text x="140" y="-10" font-family="'Noto Sans SC',sans-serif" font-size="8" fill="#3D2914" text-anchor="middle">500</text>
        </g>

        <!-- 罗盘玫瑰 -->
        <g transform="translate(920, 700)" filter="url(#ink-pen-thin)" opacity="0.75">
          <circle r="32" fill="none" stroke="#3D2914" stroke-width="1.2"/>
          <circle r="22" fill="none" stroke="#3D2914" stroke-width="0.6" stroke-dasharray="2,2"/>
          <path d="M 0 -30 L 4 0 L 0 30 L -4 0 Z" fill="#3D2914" opacity="0.7"/>
          <path d="M -30 0 L 0 4 L 30 0 L 0 -4 Z" fill="#3D2914" opacity="0.5"/>
          <text x="0" y="-38" font-family="'Noto Serif SC',serif" font-size="13" fill="#3D2914" text-anchor="middle" font-weight="700">N</text>
          <text x="0" y="48" font-family="'Noto Serif SC',serif" font-size="10" fill="#3D2914" text-anchor="middle">S</text>
          <text x="-40" y="4" font-family="'Noto Serif SC',serif" font-size="10" fill="#3D2914" text-anchor="end">W</text>
          <text x="40" y="4" font-family="'Noto Serif SC',serif" font-size="10" fill="#3D2914">E</text>
        </g>

        <!-- 边框装饰（中世纪手稿风） -->
        <rect x="20" y="20" width="960" height="720" fill="none" stroke="#3D2914" stroke-width="1.5" opacity="0.6"/>
        <rect x="28" y="28" width="944" height="704" fill="none" stroke="#3D2914" stroke-width="0.6" opacity="0.5"/>
        <g fill="#3D2914" opacity="0.5">
          <path d="M 20 20 L 35 20 M 20 20 L 20 35"/><path d="M 980 20 L 965 20 M 980 20 L 980 35"/>
          <path d="M 20 740 L 35 740 M 20 740 L 20 725"/><path d="M 980 740 L 965 740 M 980 740 L 980 725"/>
        </g>
      </svg>

      <!-- 诗笺面板 -->
      <div class="gm-note-panel" id="gm-note" style="display:none">
        <div class="gm-note-header">
          <span class="gm-note-city" id="gm-note-city"></span>
          <span class="gm-note-date" id="gm-note-date"></span>
          <button class="gm-note-close" id="gm-note-close" aria-label="关闭">×</button>
        </div>
        <div class="gm-note-content">
          <h3 class="gm-note-title" id="gm-note-title"></h3>
          <p class="gm-note-poem" id="gm-note-poem"></p>
          <p class="gm-note-note" id="gm-note-note"></p>
        </div>
      </div>
    </div>

    <div class="gm-hint"><span>🗺 点击城市查看诗笺 · 每条轨迹都是一段旅程</span></div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Ma+Shan+Zheng&family=JetBrains+Mono&display=swap');

<script src="../tools/d3-geo.js"></script>
<script>
(function () {
'use strict';
const W = 1000, H = 760;

// 经纬度 → viewBox 投影
// 中国范围: 73-135°E, 18-54°N
const LO = 73, HI = 135, LA_LO = 18, LA_HI = 54;
const SX = 60, SY = 60, SW = 880, SH = 640;
const proj = d3.geoMercator()
  .center([104, 35])
  .scale(700)
  .translate([W/2, H/2 - 40])
  .precision(0.1);
function project(lon, lat) { return proj([lon, lat]); }

// ==================== 渲染中国轮廓 ====================
fetch('/data/china-provinces.json').then(r => r.json()).then(geo => {
  const layer = document.getElementById('china-layer');
  const seaLayer = document.getElementById('sea-layer');
  const sea = new Set();
  // 简化的海域名（按省份中心经纬度判定）
  const seaWords = ['海'];
  geo.features.forEach(feat => {
    if (feat.geometry.type !== 'MultiPolygon' && feat.geometry.type !== 'Polygon') return;
    const name = feat.properties.name;
    if (name.includes('省') || name.includes('市') || name.includes('区')) {
      // 渲染陆地
      const path = d3.geoPath(proj)(feat);
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', path);
      p.setAttribute('fill', '#E8D9A6');
      p.setAttribute('fill-opacity', '0.65');
      p.setAttribute('stroke', '#3D2914');
      p.setAttribute('stroke-width', '1.1');
      p.setAttribute('filter', 'url(#ink-pen)');
      // 省份名（手写体小标签）
      const c = feat.properties.centroid || feat.properties.center;
      if (c) {
        const [px, py] = proj(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', px);
        t.setAttribute('y', py);
        t.setAttribute('font-family', "'Ma Shan Zheng',cursive");
        t.setAttribute('font-size', '10');
        t.setAttribute('fill', '#3D2914');
        t.setAttribute('opacity', '0.55');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('style', 'pointer-events:none');
        t.textContent = name.replace(/(省|市|自治区|壮族|回族|维吾尔)$/, '');
        layer.appendChild(t);
      }
      layer.appendChild(p);
    } else {
      sea.add(name);
    }
  });
});

// ==================== 轨迹 ====================
const places = [
  {name:'西安', x:108.94, y:34.34, visited:true, date:'2023.08', poemTitle:'长安砖上', poem:'城墙踏遍暮云平，\n钟鼓声沉月自明。\n千年往事砖缝里，\n一粒风沙一名城。'},
  {name:'杭州', x:120.16, y:30.29, visited:true, date:'2024.10', poemTitle:'西湖夜', poem:'一堤烟柳浸空濛，\n灯火随波入镜中。\n借问游船何处去，\n满湖山色半湖风。'},
  {name:'成都', x:104.07, y:30.67, visited:true, date:'2025.04', poemTitle:'锦城小住', poem:'茶烟起处市声长，\n竹影筛月过短墙。\n人间至味是清欢处，\n一盏盖碗慢慢凉。'}
];

document.getElementById('gm-count').textContent = places.length;

fetch('/data/china-provinces.json').then(r => r.json()).then(geo => {
  setTimeout(() => {
    // 轨迹：按日期排序连接
    const traj = document.getElementById('trajectory');
    const sorted = [...places].sort((a, b) => a.date.localeCompare(b.date));
    for (let i = 0; i < sorted.length - 1; i++) {
      const a = proj([sorted[i].x, sorted[i].y]);
      const b = proj([sorted[i+1].x, sorted[i+1].y]);
      // 中世纪虚线+中段偏移
      const mx = (a[0] + b[0]) / 2 + (i % 2 === 0 ? -30 : 30);
      const my = (a[1] + b[1]) / 2 + 20;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M ${a[0]} ${a[1]} Q ${mx} ${my} ${b[0]} ${b[1]}`);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', '#7A2F3F');
      p.setAttribute('stroke-width', '1.5');
      p.setAttribute('stroke-dasharray', '5,3');
      p.setAttribute('opacity', '0.7');
      p.setAttribute('marker-end', 'url(#arrow)');
      traj.appendChild(p);
      // 轨迹日期标注
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', mx);
      t.setAttribute('y', my - 6);
      t.setAttribute('font-family', "'JetBrains Mono',monospace");
      t.setAttribute('font-size', '9');
      t.setAttribute('fill', '#7A2F3F');
      t.setAttribute('opacity', '0.8');
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('style', 'pointer-events:none');
      t.textContent = sorted[i+1].date;
      traj.appendChild(t);
    }
    renderCityMarkers();
  }, 200);
});

function renderCityMarkers() {
  const layer = document.getElementById('city-markers');
  layer.innerHTML = '';
  places.forEach(p => {
    const [x, y] = proj([p.x, p.y]);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'city-marker');
    g.setAttribute('transform', `translate(${x}, ${y})`);
    g.setAttribute('data-city', p.name);

    // 印章圆
    const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c1.setAttribute('r', '9');
    c1.setAttribute('fill', '#7A2F3F');
    c1.setAttribute('stroke', '#3D2914');
    c1.setAttribute('stroke-width', '1.5');
    c1.setAttribute('filter', 'url(#stamp)');
    g.appendChild(c1);

    // 内点
    const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c2.setAttribute('r', '3');
    c2.setAttribute('fill', '#F2E7C8');
    g.appendChild(c2);

    // 名称（手写体）
    const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t1.setAttribute('x', 14);
    t1.setAttribute('y', -2);
    t1.setAttribute('font-family', "'Ma Shan Zheng',cursive");
    t1.setAttribute('font-size', '15');
    t1.setAttribute('fill', '#3D2914');
    t1.setAttribute('font-weight', '700');
    t1.setAttribute('style', 'paint-order:stroke;stroke:#F2E7C8;stroke-width:3');
    t1.textContent = p.name;
    g.appendChild(t1);

    // 日期
    const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t2.setAttribute('x', 14);
    t2.setAttribute('y', 10);
    t2.setAttribute('font-family', "'JetBrains Mono',monospace");
    t2.setAttribute('font-size', '9');
    t2.setAttribute('fill', '#7A2F3F');
    t2.setAttribute('style', 'paint-order:stroke;stroke:#F2E7C8;stroke-width:2.5');
    t2.textContent = p.date;
    g.appendChild(t2);

    g.addEventListener('click', () => showNote(p));
    layer.appendChild(g);
  });
}

function showNote(p) {
  document.getElementById('gm-note-city').textContent = p.name;
  document.getElementById('gm-note-date').textContent = p.date;
  document.getElementById('gm-note-title').textContent = p.poemTitle || '行迹';
  document.getElementById('gm-note-poem').textContent = p.poem || '';
  document.getElementById('gm-note-note').textContent = p.note || '';
  const panel = document.getElementById('gm-note');
  panel.style.display = 'block';
  panel.dataset.city = p.name;
}

document.getElementById('gm-note-close').addEventListener('click', () => {
  document.getElementById('gm-note').style.display = 'none';
});

// 点击地图空白处关闭
document.getElementById('gm-map').addEventListener('click', e => {
  if (!e.target.closest('.city-marker') && !e.target.closest('.gm-note-panel')) {
    document.getElementById('gm-note').style.display = 'none';
  }
});
})();
</script>
