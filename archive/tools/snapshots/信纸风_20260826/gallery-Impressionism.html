<!-- ============ Impressionism · 复古信纸画墙（SHUOSHUO 信纸基因） ============ -->
<div class="gw-wrap">
  <div class="gw-deco gw-deco-a" aria-hidden="true"></div>
  <div class="gw-deco gw-deco-b" aria-hidden="true"></div>

  <header class="gw-hero">
    <span class="gw-seal">彩</span>
    <div class="gw-head-text">
      <span class="gw-eyebrow">GALLERY · IMPRESSIONISM</span>
      <h1 class="gw-title">Impressionism</h1>
      <p class="gw-hand">印象派的碎光</p>
    </div>
    <a class="gw-back" href="/gallery/">← 回调色盘</a>
  </header>

  <section class="gw-grid">
      <figure class="gw-card" data-idx="0">
        <img src="/image/gallery/Impressionism/1.jpg" alt="Impressionism 1" loading="lazy">
        <figcaption>彩 · 其一</figcaption>
      </figure>

      <figure class="gw-card" data-idx="1">
        <img src="/image/gallery/Impressionism/2.jpg" alt="Impressionism 2" loading="lazy">
        <figcaption>彩 · 其二</figcaption>
      </figure>

      <figure class="gw-card" data-idx="2">
        <img src="/image/gallery/Impressionism/3.png" alt="Impressionism 3" loading="lazy">
        <figcaption>彩 · 其三</figcaption>
      </figure>

      <figure class="gw-card" data-idx="3">
        <img src="/image/gallery/Impressionism/4.jpg" alt="Impressionism 4" loading="lazy">
        <figcaption>彩 · 其四</figcaption>
      </figure>

      <figure class="gw-card" data-idx="4">
        <img src="/image/gallery/Impressionism/5.jpg" alt="Impressionism 5" loading="lazy">
        <figcaption>彩 · 其五</figcaption>
      </figure>
  </section>

  <footer class="gw-foot"><span>✿</span><p>光落进纸里，就成了画</p></footer>
</div>

<dialog class="gw-lightbox" id="gw-lb">
  <img id="gw-lb-img" alt="">
  <div class="gw-lb-bar">
    <button class="gw-lb-btn" id="gw-prev">‹</button>
    <button class="gw-lb-btn" id="gw-next">›</button>
    <button class="gw-lb-btn" id="gw-close">✕</button>
  </div>
</dialog>

<style>
/* ===== 复古信纸基因：米黄格纹底 · 朱砂印 · 硬投影便签卡（令牌见 SHUOSHUO_DESIGN_SPEC v1） ===== */
.gw-wrap{
  --primary:#3e2723;--secondary:#5d4037;--light-bg:#f5f1e8;--paper:#fff9e6;
  --border:#d9c7a1;--shadow-c:rgba(93,64,55,.2);--seal:#B03A5B;
  position:relative;max-width:1100px;margin:0 auto;padding:2.2rem 1.6rem 2.6rem;
  background:var(--light-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><rect fill="none" width="100" height="100"/><path d="M0,50 L100,50" stroke="%233e2723" stroke-width="1"/><path d="M50,0 L50,100" stroke="%233e2723" stroke-width="1"/></svg>');
  background-size:100px 100px;
  border:1px solid var(--border);border-radius:4px;
  box-shadow:3px 3px 10px var(--shadow-c);
  font-family:'Noto Serif SC','Ma Shan Zheng',serif;color:var(--primary);line-height:1.6;
}
/* 角落墨纹装饰 */
.gw-deco{position:absolute;width:200px;height:200px;opacity:.05;z-index:0;pointer-events:none}
.gw-deco-a{top:24px;left:16px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M20,10 Q40,5 50,20 T80,10 Q95,30 85,50 T95,80 Q75,95 50,85 T10,80 Q5,60 20,50 T10,20 Q25,5 50,10 Z" fill="%233e2723"/></svg>')}
.gw-deco-b{bottom:24px;right:16px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="%233e2723" stroke-width="2"/><circle cx="50" cy="50" r="30" fill="none" stroke="%233e2723" stroke-width="1"/></svg>')}

.gw-hero{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:1.4rem;padding:1.6rem 1rem 2.2rem}
.gw-seal{
  width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;
  background:var(--seal);color:#fff;font-family:'Noto Serif SC',serif;font-size:1.7rem;font-weight:900;
  border-radius:6px;box-shadow:2px 3px 9px rgba(62,39,35,.3);
  transform:rotate(-4deg);position:relative;
}
.gw-seal::after{content:'';position:absolute;inset:4px;border:1.5px solid rgba(255,255,255,.55);border-radius:3px}
.gw-head-text{text-align:left}
.gw-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.38em;color:var(--secondary)}
.gw-title{
  font-family:'Noto Serif SC',Georgia,serif;font-weight:700;font-size:clamp(2rem,4.5vw,3.1rem);
  letter-spacing:3px;margin:.2rem 0 .3rem;color:var(--primary);position:relative;display:inline-block;
}
.gw-title::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-10px;
  width:min(200px,72%);height:4px;
  background:linear-gradient(90deg,transparent,var(--secondary),transparent);
}
.gw-hand{font-family:'Ma Shan Zheng',cursive;font-size:1.15rem;color:var(--secondary);margin:1rem 0 0}
.gw-back{
  position:absolute;right:0;top:1.4rem;font-size:.85rem;color:var(--secondary);text-decoration:none;
  border-bottom:1px dashed var(--border);padding-bottom:2px;transition:color .25s,opacity .25s;
}
.gw-back:hover{color:var(--seal);opacity:.75}

.gw-grid{position:relative;z-index:1;column-count:3;column-gap:1.4rem}
@media(max-width:900px){.gw-grid{column-count:2}}
@media(max-width:560px){.gw-grid{column-count:1}}

/* 图片卡 = motto-card 变体：纸底近直角 + 硬投影 + 手贴微旋转 */
.gw-card{
  break-inside:avoid;margin:0 0 1.4rem;position:relative;
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  box-shadow:3px 3px 10px var(--shadow-c);
  padding:.7rem .7rem 0;cursor:zoom-in;
  transition:transform .3s ease,box-shadow .3s ease;
}
.gw-card:nth-child(3n+1){transform:rotate(-1deg)}
.gw-card:nth-child(3n+2){transform:rotate(.5deg)}
.gw-card:nth-child(3n+3){transform:rotate(1.2deg)}
.gw-card::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.08"><rect fill="none" width="100" height="100"/><path d="M20,0 L0,20" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/><path d="M40,0 L0,40" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/></svg>');
  background-size:30px 30px;
}
.gw-card:hover{transform:rotate(0) scale(1.02);box-shadow:5px 5px 15px rgba(0,0,0,.2);z-index:2}
.gw-card img{width:100%;display:block;border:1px solid var(--border);border-radius:2px}
.gw-card figcaption{
  font-family:'Noto Serif SC',serif;font-size:.85rem;letter-spacing:.14em;
  font-style:italic;text-align:right;color:var(--secondary);
  border-top:1px dashed var(--border);padding:.6rem .15rem .75rem;margin-top:.65rem;
}

/* 灯箱：保留暗底，描边按钮入棕调 */
.gw-lightbox{
  border:1px solid rgba(217,199,161,.32);border-radius:6px;padding:0;
  background:rgba(30,26,22,.94);max-width:92vw;max-height:92vh;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.gw-lightbox::backdrop{background:rgba(20,17,15,.85)}
.gw-lightbox img{display:block;max-width:90vw;max-height:82vh;margin:auto;border-radius:4px 4px 0 0}
.gw-lb-bar{display:flex;justify-content:center;gap:1rem;padding:.7rem;border-top:1px dashed rgba(217,199,161,.25)}
.gw-lb-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(217,199,161,.45);
  background:transparent;color:#f5f1e8;font-size:1.15rem;cursor:pointer;
  transition:background .2s,border-color .2s;
}
.gw-lb-btn:hover{background:rgba(176,58,91,.4);border-color:#B03A5B}

.gw-foot{position:relative;z-index:1;text-align:center;margin-top:2.2rem}
.gw-foot span{color:var(--seal)}
.gw-foot p{font-family:'Ma Shan Zheng',cursive;color:var(--secondary);font-size:1.05rem;margin:.3rem 0 0}

@media(max-width:560px){.gw-wrap{padding:1.6rem 1rem 2.2rem}}
@media (prefers-reduced-motion:reduce){
  .gw-wrap *,.gw-lightbox *{transition:none!important;animation:none!important}
  .gw-card:hover{transform:none}
}
</style>

<script>
(function(){
  'use strict';
  var SLIDES = ["/image/gallery/Impressionism/1.jpg","/image/gallery/Impressionism/2.jpg","/image/gallery/Impressionism/3.png","/image/gallery/Impressionism/4.jpg","/image/gallery/Impressionism/5.jpg"];
  var lb=document.getElementById('gw-lb'), img=document.getElementById('gw-lb-img');
  if(!lb) return;
  var cur=0;
  function show(i){ cur=(i+SLIDES.length)%SLIDES.length; img.src=SLIDES[cur]; }
  document.querySelectorAll('.gw-card').forEach(function(card){
    card.addEventListener('click',function(){
      show(+card.dataset.idx||0);
      if(typeof lb.showModal==='function') lb.showModal(); else lb.setAttribute('open','');
    });
  });
  document.getElementById('gw-prev').addEventListener('click',function(e){e.stopPropagation();show(cur-1)});
  document.getElementById('gw-next').addEventListener('click',function(e){e.stopPropagation();show(cur+1)});
  document.getElementById('gw-close').addEventListener('click',function(){lb.close()});
  lb.addEventListener('click',function(e){ if(e.target===lb) lb.close(); });
  document.addEventListener('keydown',function(e){
    if(!lb.open)return;
    if(e.key==='ArrowLeft')show(cur-1);
    else if(e.key==='ArrowRight')show(cur+1);
  });
})();
</script>
