<!-- ============ 行迹 · 复古信纸 × 古地图（信纸设计基因 v1 转译；功能逻辑零改动） ============ -->
<div class="mp-scroll">
  <div class="mp-band" aria-hidden="true"></div>
  <div class="mp-corner mp-corner-tl" aria-hidden="true"></div>
  <div class="mp-corner mp-corner-br" aria-hidden="true"></div>

  <header class="mp-hero">
    <span class="mp-badge">行迹 · TRAVELED INK</span>
    <h1 class="mp-title">山河行迹图</h1>
    <p class="mp-hand">走过的每一处，都亮着一盏灯</p>
    <p class="mp-hint">滚轮缩放 · 拖拽平移 · 点击点亮之地读诗</p>
  </header>

  <!-- 古地图纸张卡：paper 底 + 褐边 + 硬投影 + 四角相角 + 微倾 -->
  <div class="mp-mapframe">
    <span class="mp-pcorner mp-pcorner-tl" aria-hidden="true"></span>
    <span class="mp-pcorner mp-pcorner-tr" aria-hidden="true"></span>
    <span class="mp-pcorner mp-pcorner-bl" aria-hidden="true"></span>
    <span class="mp-pcorner mp-pcorner-br" aria-hidden="true"></span>

    <!-- 地图视口 -->
    <div class="mp-viewport" id="mp-viewport">
      <div class="mp-canvas" id="mp-canvas">
        <svg id="mp-svg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" aria-label="古地图风行迹地图（可缩放）">
          <defs>
            <filter id="mp-wash" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="18"/>
            </filter>
            <filter id="mp-ink" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.1"/>
            </filter>
          </defs>

          <!-- 做旧水彩色斑：降饱和，融入米黄纸调 -->
          <g filter="url(#mp-wash)" opacity=".4">
            <ellipse cx="250" cy="180" rx="190" ry="120" fill="#B08A5F"/>  <!-- 西漠褪赭 -->
            <ellipse cx="560" cy="150" rx="170" ry="100" fill="#A3A284"/>  <!-- 漠北枯草 -->
            <ellipse cx="640" cy="400" rx="200" ry="130" fill="#94A186"/>  <!-- 中原灰绿 -->
            <ellipse cx="800" cy="470" rx="150" ry="110" fill="#7C92A3"/>  <!-- 江南褪花青 -->
            <ellipse cx="430" cy="560" rx="160" ry="100" fill="#8B967C"/>  <!-- 岭南苍绿 -->
            <ellipse cx="950" cy="350" rx="90"  ry="220" fill="#97A9B4"/>  <!-- 东海水色 -->
          </g>

          <!-- 山脉（皴笔改棕调墨线） -->
          <g filter="url(#mp-ink)" opacity=".55" stroke="#5D4037" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path d="M180 240 l26 -44 22 40 20 -30 24 42"/>
            <path d="M255 205 l20 -34 18 30 18 -24 20 36"/>
            <path d="M330 300 l22 -38 20 34 18 -26 22 38"/>
            <path d="M300 520 l24 -40 20 36 20 -28 22 40"/>
            <path d="M560 560 l22 -36 20 32 18 -24 20 34"/>
            <path d="M120 420 l22 -36 20 32 18 -24 20 34"/>
          </g>

          <!-- 江河（褪色双钩） -->
          <g filter="url(#mp-ink)" fill="none" stroke="#6E86A0" opacity=".55">
            <path d="M60 250 C 220 230, 330 300, 470 280 S 720 240, 900 300" stroke-width="7" opacity=".5"/>
            <path d="M380 640 C 460 560, 520 520, 610 470 S 780 430, 960 430" stroke-width="9" opacity=".55"/>
          </g>

          <!-- 区域题字（竖排） -->
          <g font-family="'Noto Serif SC',serif" fill="#5D4037" opacity=".7" font-size="19" letter-spacing="4">
            <text x="215" y="120" writing-mode="tb">西 域</text>
            <text x="560" y="80"  writing-mode="tb">漠 北</text>
            <text x="640" y="300" writing-mode="tb">中 原</text>
            <text x="805" y="360" writing-mode="tb">江 南</text>
            <text x="435" y="500" writing-mode="tb">西南</text>
            <text x="705" y="545" writing-mode="tb">岭 南</text>
            <text x="940" y="180" writing-mode="tb">东海</text>
          </g>

          <!-- 地点层（JS 注入） -->
          <g id="mp-spots"></g>
        </svg>
      </div>

      <!-- 缩放控件 -->
      <div class="mp-ctrl">
        <button id="mp-zin"  title="放大">＋</button>
        <button id="mp-zout" title="缩小">－</button>
        <button id="mp-zreset" title="复位">◎</button>
      </div>
      <div class="mp-legend">
        <span class="mp-dot lit"></span> 已点亮 · 有诗
        <span class="mp-dot dim"></span> 未至
      </div>
    </div>
  </div>

  <footer class="mp-foot">
    <div class="mp-brandline" aria-hidden="true"></div>
    <p>此卷山河，随行迹徐徐展开</p>
  </footer>
</div>

<!-- 诗笺弹层 -->
<div class="mp-mask" id="mp-mask">
  <div class="mp-poem-card" role="dialog" aria-modal="true">
    <button class="mp-poem-close" id="mp-poem-close" aria-label="关闭">✕</button>
    <div class="mp-poem-strip" id="mp-poem-strip">行迹</div>
    <div class="mp-poem-body">
      <h3 id="mp-poem-place">—</h3>
      <p class="mp-poem-date" id="mp-poem-date">—</p>
      <div class="mp-poem-lines" id="mp-poem-lines">—</div>
      <p class="mp-poem-note" id="mp-poem-note"></p>
    </div>
    <span class="mp-poem-seal" aria-hidden="true">迹</span>
  </div>
</div>

<style>
/* ===== 行迹 · 复古信纸 × 古地图（信纸基因 v1；仅换皮，脚本未动） ===== */
.mp-scroll, .mp-mask {
  --primary: #3e2723;
  --secondary: #5d4037;
  --light-bg: #f5f1e8;
  --paper: #fff9e6;
  --border: #d9c7a1;
  --shadow: rgba(93,64,55,.2);
  --cinnabar: #B03A5B;   /* 朱砂 */
}
.mp-scroll {
  position:relative; max-width:1080px; margin:0 auto;
  background:var(--light-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><rect fill="none" width="100" height="100"/><path d="M0,50 L100,50" stroke="%233e2723" stroke-width="1"/><path d="M50,0 L50,100" stroke="%233e2723" stroke-width="1"/></svg>');
  background-size:100px 100px;
  border:1px solid var(--border); border-radius:4px;
  box-shadow:3px 3px 10px var(--shadow);
  padding:2.4rem 2rem 2.2rem; overflow:hidden;
  font-family:'Noto Serif SC','Ma Shan Zheng',serif; color:var(--primary);
  line-height:1.6;
}
/* 顶部褪色织带 */
.mp-band {
  position:absolute; top:0; left:0; right:0; height:8px; opacity:.9;
  background:linear-gradient(90deg,#3E2723 0 30%, #5D4037 30% 55%, #8D6E63 55% 80%, #BCAAA4 80% 100%);
  background-size:72px 100%;
}
/* 容器双线角饰 */
.mp-corner { position:absolute; width:44px; height:44px; pointer-events:none; z-index:3; opacity:.45; }
.mp-corner::before { content:''; position:absolute; inset:0; border:2px solid var(--secondary); }
.mp-corner::after  { content:''; position:absolute; inset:5px; border:1px solid var(--secondary); }
.mp-corner-tl { top:16px; left:16px; } .mp-corner-tl::before,.mp-corner-tl::after { border-right:0; border-bottom:0; }
.mp-corner-br { bottom:16px; right:16px; } .mp-corner-br::before,.mp-corner-br::after { border-left:0; border-top:0; }

/* 页首：衬线 H1 + 渐变下划线 + 手写副题 */
.mp-hero { position:relative; z-index:1; text-align:center; padding:.6rem 1rem 1.9rem; }
.mp-badge {
  display:inline-block; font-size:.72rem; letter-spacing:.38em;
  color:var(--secondary); border:1px dashed var(--secondary); border-radius:999px;
  padding:.26rem 1rem .24rem 1.15rem; margin-bottom:1.05rem; opacity:.85;
}
.mp-title {
  font-weight:700; letter-spacing:3px;
  font-size:clamp(2rem,4.4vw,3.1rem); margin:0; color:var(--primary);
  position:relative; display:inline-block;
}
.mp-title::after {
  content:""; position:absolute; bottom:-12px; left:50%; transform:translateX(-50%);
  width:200px; height:4px;
  background:linear-gradient(90deg, transparent, var(--secondary), transparent);
}
.mp-hand { font-family:'Ma Shan Zheng',cursive; font-size:1.28rem; color:var(--secondary); margin:1.35rem 0 .35rem; }
.mp-hint { font-style:italic; font-size:.82rem; color:#7A6A56; margin:0; letter-spacing:.06em; }

/* 古地图纸张卡：paper 底卡纸 + 1px 褐边 + 硬投影 + 内框细线 + 相角 + 微倾 */
.mp-mapframe {
  position:relative; z-index:1;
  max-width:960px; margin:0 auto;
  background:linear-gradient(var(--paper), #FBF3DC);
  border:1px solid var(--border); border-radius:4px;
  box-shadow:4px 4px 12px var(--shadow);
  padding:12px;
  transform:rotate(-0.4deg);
}
.mp-mapframe::before {
  content:''; position:absolute; inset:7px; border:1px solid rgba(93,64,55,.26);
  pointer-events:none;
}
.mp-pcorner { position:absolute; width:24px; height:24px; pointer-events:none; z-index:3; opacity:.82; }
.mp-pcorner::before { content:''; position:absolute; inset:0; background:var(--secondary); }
.mp-pcorner-tl { top:5px; left:5px; }   .mp-pcorner-tl::before { clip-path:polygon(0 0, 100% 0, 0 100%); }
.mp-pcorner-tr { top:5px; right:5px; }  .mp-pcorner-tr::before { clip-path:polygon(0 0, 100% 0, 100% 100%); }
.mp-pcorner-bl { bottom:5px; left:5px; }  .mp-pcorner-bl::before { clip-path:polygon(0 0, 0 100%, 100% 100%); }
.mp-pcorner-br { bottom:5px; right:5px; } .mp-pcorner-br::before { clip-path:polygon(100% 0, 100% 100%, 0 100%); }

/* 视口与画布：做旧经纬网格衬在纸上 */
.mp-viewport {
  position:relative; overflow:hidden; height:520px;
  cursor:grab; touch-action:none;
  background:
    repeating-linear-gradient(0deg, rgba(93,64,55,.05) 0 1px, transparent 1px 90px),
    repeating-linear-gradient(90deg, rgba(93,64,55,.05) 0 1px, transparent 1px 90px),
    linear-gradient(#FDFAEE, #F7EFDA);
}
.mp-viewport:active { cursor:grabbing; }
.mp-canvas { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
#mp-svg { width:100%; height:100%; display:block; }

/* 地点标记：点亮朱砂 / 未至虚线圈 */
.mp-spot { cursor:pointer; outline:none; }
.mp-spot .halo { fill:var(--cinnabar); opacity:.14; }
.mp-spot.lit .core { fill:var(--cinnabar); stroke:#FFF9E6; stroke-width:2; }
.mp-spot.lit .pulse {
  stroke:var(--cinnabar);
  animation:mp-pulse 2.4s ease-out infinite; transform-origin:center; transform-box:fill-box;
}
@keyframes mp-pulse { 0%{opacity:.55; transform:scale(.6)} 70%{opacity:0; transform:scale(2.1)} 100%{opacity:0} }
.mp-spot:focus-visible .halo { opacity:.32; }
.mp-spot .label {
  font-family:'Noto Serif SC',serif; font-size:15px; fill:#3E2723;
  paint-order:stroke; stroke:#FBF4E2; stroke-width:4px; letter-spacing:2px;
}
.mp-spot.ghost .halo { fill:var(--secondary); opacity:.07; }
.mp-spot.ghost .core { fill:#F5EDD8; stroke:#8D7B63; stroke-width:1.4; stroke-dasharray:3 2.6; }
.mp-spot.ghost .label { fill:#8D7B63; }

/* 控件与图例：圆形 #d7ccc8 按钮 */
.mp-ctrl { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:2; }
.mp-ctrl button {
  width:40px; height:40px; border-radius:50%;
  border:1px solid #BCA892; background:#d7ccc8; color:var(--primary);
  font-size:1.05rem; line-height:1; cursor:pointer;
  font-family:'Noto Serif SC',serif; box-shadow:2px 2px 6px var(--shadow);
  transition:all .25s ease;
}
.mp-ctrl button:hover {
  background:var(--secondary); color:#FFF9E6;
  transform:translateY(-2px); box-shadow:3px 4px 10px rgba(0,0,0,.2);
}
.mp-ctrl button:active { transform:translateY(0); }
.mp-legend {
  position:absolute; left:14px; bottom:14px; z-index:2;
  background:rgba(255,249,230,.88); border:1px dashed var(--border); border-radius:4px;
  font-size:.78rem; font-style:italic; color:var(--secondary);
  padding:.4rem .7rem; display:flex; align-items:center; gap:.45rem;
}
.mp-dot { width:10px; height:10px; border-radius:50%; display:inline-block; box-sizing:border-box; }
.mp-dot.lit { background:var(--cinnabar); box-shadow:0 0 0 2px rgba(255,249,230,.95), 0 0 0 3px rgba(176,58,91,.35); }
.mp-dot.dim { background:transparent; border:1.5px dashed #8D7B63; margin-left:.6rem; }

/* 竖排诗笺弹层：paper 底 + dashed 边 + 大引号 + 斜纹肌理 */
.mp-mask {
  position:fixed; inset:0; background:rgba(62,39,35,.45); backdrop-filter:blur(3px);
  display:none; place-items:center; z-index:999; padding:1rem;
}
.mp-mask.show { display:grid; }
.mp-poem-card {
  position:relative; width:min(430px, 94vw); max-height:86vh; overflow:auto;
  background:var(--paper);
  border:2px dashed var(--border); border-radius:10px;
  padding:2rem 1.8rem 1.6rem 3.2rem;
  box-shadow:6px 6px 18px rgba(0,0,0,.35);
  animation:mp-in .3s cubic-bezier(.16,1,.3,1);
}
.mp-poem-card::before {
  content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.08"><rect fill="none" width="100" height="100"/><path d="M20,0 L0,20" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/><path d="M40,0 L0,40" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/></svg>');
  background-size:30px 30px;
}
.mp-poem-card::after {
  content:'\201C'; position:absolute; top:-.4rem; left:50%; transform:translateX(-50%);
  font-family:Georgia,'Noto Serif SC',serif; font-size:3.4rem; line-height:1;
  color:var(--secondary); opacity:.28; pointer-events:none;
}
@keyframes mp-in { from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1} }
.mp-poem-strip {
  position:absolute; left:0; top:0; bottom:0; width:2.1rem;
  background:linear-gradient(#5D4037,#3E2723); color:#FFF9E6;
  writing-mode:vertical-rl; display:flex; align-items:center; justify-content:center;
  font-family:'Noto Serif SC',serif; letter-spacing:.4em; font-size:.95rem;
  border-right:1px dashed rgba(255,249,230,.35);
  border-radius:8px 0 0 8px;
}
.mp-poem-close {
  position:absolute; right:.7rem; top:.6rem; width:28px; height:28px; border-radius:50%;
  border:1px dashed var(--secondary); background:transparent; color:var(--secondary); cursor:pointer;
}
.mp-poem-close:hover { color:var(--cinnabar); border-color:var(--cinnabar); }
.mp-poem-body h3 {
  font-family:'Noto Serif SC',serif; font-weight:700; font-size:1.32rem;
  letter-spacing:.12em; margin:0 0 .25rem; color:var(--primary);
}
.mp-poem-date {
  font-family:'Noto Serif SC',serif; font-style:italic; font-size:.9rem; color:var(--secondary);
  text-align:right; letter-spacing:.06em; margin:0 0 .9rem;
}
.mp-poem-lines {
  font-family:'Noto Serif SC',serif; font-size:1.06rem; line-height:2.2; color:#4E342E;
  border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); padding:.9rem .2rem;
  white-space:pre-line;
}
.mp-poem-note { font-size:.84rem; font-style:italic; color:var(--secondary); margin:.85rem 0 0; }
.mp-poem-seal {
  position:absolute; right:1rem; bottom:.9rem; width:32px; height:32px;
  display:grid; place-items:center; background:var(--cinnabar); color:#FFF9E6;
  font-family:'Noto Serif SC',serif; font-size:.95rem; border-radius:4px;
  transform:rotate(-6deg); box-shadow:1px 1px 4px rgba(0,0,0,.25);
}

/* 页脚手写收尾 */
.mp-brandline { width:200px; height:4px; margin:0 auto .9rem; background:linear-gradient(90deg, transparent, var(--secondary), transparent); }
.mp-foot { position:relative; z-index:1; text-align:center; margin-top:1.8rem; }
.mp-foot p { font-family:'Ma Shan Zheng',cursive; font-size:1.05rem; color:var(--secondary); margin:0; }

@media (max-width:640px){
  .mp-scroll{padding:1.8rem .9rem 1.6rem;}
  .mp-mapframe{padding:9px;}
  .mp-viewport{height:400px;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<script>
(function () {
  'use strict';
  var viewport = document.getElementById('mp-viewport');
  var canvas = document.getElementById('mp-canvas');
  if (!viewport || !canvas) return;

  /* ---------- 数据 ---------- */
  fetch('/data/places.json')
    .then(function (r) { return r.json(); })
    .then(function (places) { renderSpots(places || []); })
    .catch(function (e) { console.error('places.json 加载失败', e); });
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function renderSpots(places) {
    var layer = document.getElementById('mp-spots');
    if (!layer) return;
    layer.innerHTML = places.map(function (p, i) {
      var lit = p.visited !== false;
      return '<g class="mp-spot ' + (lit ? 'lit' : 'ghost') + '" data-i="' + i + '" tabindex="0" role="button" aria-label="' + esc(p.name) + '">' +
        (lit ? '<circle class="pulse" cx="' + p.x + '" cy="' + p.y + '" r="13" fill="none" stroke="#C44D3F" stroke-width="1.5"/>' : '') +
        '<circle class="halo" cx="' + p.x + '" cy="' + p.y + '" r="10"/>' +
        '<circle class="core" cx="' + p.x + '" cy="' + p.y + '" r="5.5"/>' +
        '<text class="label" x="' + (p.x + 13) + '" y="' + (p.y + 5) + '">' + esc(p.name) + '</text>' +
        '</g>';
    }).join('');
    Array.prototype.forEach.call(layer.querySelectorAll('.mp-spot'), function (node) {
      node.addEventListener('click', function () { openPoem(places[+this.getAttribute('data-i')]); });
      node.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPoem(places[+this.getAttribute('data-i')]); }
      });
    });
  }
  /* ---------- 诗笺 ---------- */
  function openPoem(p) {
    if (!p) return;
    document.getElementById('mp-poem-place').textContent = p.name || '—';
    document.getElementById('mp-poem-strip').textContent = (p.poemTitle || '行迹').split('').join(' ');
    document.getElementById('mp-poem-date').textContent = p.date ? '✿ ' + p.date : '';
    document.getElementById('mp-poem-lines').textContent = p.poem || '（此处还没有落下诗句）';
    document.getElementById('mp-poem-note').textContent = p.note || '';
    document.getElementById('mp-mask').classList.add('show');
  }
  document.getElementById('mp-poem-close').addEventListener('click', function () {
    document.getElementById('mp-mask').classList.remove('show');
  });
  document.getElementById('mp-mask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('mp-mask').classList.remove('show');
  });
  /* ---------- 缩放与平移 ---------- */
  var scale = 1, tx = 0, ty = 0, MIN = 1, MAX = 4;
  function apply() {
    canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }
  function zoomAt(cx, cy, factor) {
    var ns = Math.min(MAX, Math.max(MIN, scale * factor));
    if (ns === scale) return;
    var rect = viewport.getBoundingClientRect();
    var px = cx - rect.left, py = cy - rect.top;
    tx = px - (px - tx) * (ns / scale);
    ty = py - (py - ty) * (ns / scale);
    scale = ns; clampPan(); apply();
  }
  function clampPan() {
    var rect = viewport.getBoundingClientRect();
    var minX = rect.width - rect.width * scale, minY = rect.height - rect.height * scale;
    tx = Math.min(0, Math.max(minX, tx));
    ty = Math.min(0, Math.max(minY, ty));
  }
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
  viewport.addEventListener('pointerdown', function (e) {
    dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy); clampPan(); apply();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    viewport.addEventListener(ev, function () { dragging = false; });
  });
  document.getElementById('mp-zin').addEventListener('click', function () {
    var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.3);
  });
  document.getElementById('mp-zout').addEventListener('click', function () {
    var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.3);
  });
  document.getElementById('mp-zreset').addEventListener('click', function () {
    scale = 1; tx = 0; ty = 0; apply();
  });
})();
</script>
