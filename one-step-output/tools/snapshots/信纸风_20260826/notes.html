<!-- ============ 笔记 · 复古信纸（SHUOSHUO_DESIGN_SPEC 信纸基因；数据源 notebooks.json，契约不变） ============ -->
<div class="ik-scroll">
  <div class="ik-dec ik-dec-1" aria-hidden="true"></div>
  <div class="ik-dec ik-dec-2" aria-hidden="true"></div>

  <header class="ik-hero">
    <h1 class="ik-title">笔记簿</h1>
    <p class="ik-subtitle">Yetbyeの手抄信笺</p>
    <div class="ik-stats">
      <p>一页一页，慢慢写完</p>
      <p>共 <span class="count" id="notebookCount">0</span> 本笔记 · <span class="count" id="articleCount">0</span> 篇文章</p>
    </div>
  </header>

  <section id="notebooks-grid" class="ik-grid" aria-live="polite"></section>
  <nav id="pagination" class="ik-pagination" aria-label="笔记本分页"></nav>

  <footer class="ik-foot">
    <p>笔记皆为基础概念的手抄与整理</p>
  </footer>
</div>

<style>
/* ===== 笔记簿 · 复古信纸 —— 遵循 SHUOSHUO_DESIGN_SPEC v1 信纸基因 ===== */
.ik-scroll {
  --primary: #3e2723;
  --secondary: #5d4037;
  --light-bg: #f5f1e8;
  --paper: #fff9e6;
  --border: #d9c7a1;
  --shadow: rgba(93, 64, 55, 0.2);
  position: relative;
  max-width: 1100px;
  margin: 0 auto;
  background: var(--light-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><rect fill="none" width="100" height="100"/><path d="M0,50 L100,50" stroke="%233e2723" stroke-width="1"/><path d="M50,0 L50,100" stroke="%233e2723" stroke-width="1"/></svg>');
  background-size: 100px 100px;
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 12px 34px rgba(62, 39, 35, 0.22);
  padding: 40px 34px 34px;
  overflow: hidden;
  font-family: 'Noto Serif SC', 'Ma Shan Zheng', serif;
  color: var(--primary);
  line-height: 1.7;
}
/* 角落装饰（低透明度，不挡交互） */
.ik-scroll .ik-dec {
  position: absolute;
  width: 200px;
  height: 200px;
  opacity: 0.05;
  z-index: 1;
  pointer-events: none;
}
.ik-scroll .ik-dec-1 {
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M20,10 Q40,5 50,20 T80,10 Q95,30 85,50 T95,80 Q75,95 50,85 T10,80 Q5,60 20,50 T10,20 Q25,5 50,10 Z" fill="%233e2723"/></svg>');
  top: 8%;
  left: 4%;
}
.ik-scroll .ik-dec-2 {
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="%233e2723" stroke-width="2"/><circle cx="50" cy="50" r="30" fill="none" stroke="%233e2723" stroke-width="1"/></svg>');
  bottom: 8%;
  right: 4%;
}
/* Hero：H1 渐变下划线 + italic 副题 */
.ik-scroll .ik-hero {
  position: relative;
  z-index: 2;
  text-align: center;
  margin: 30px 0 0;
  padding: 10px 20px 0;
}
.ik-scroll .ik-title {
  display: inline-block;
  position: relative;
  font-size: 3.5rem;
  font-weight: 700;
  letter-spacing: 3px;
  margin: 0 0 15px;
  color: var(--primary);
}
.ik-scroll .ik-title::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 4px;
  background: linear-gradient(90deg, transparent, var(--secondary), transparent);
}
.ik-scroll .ik-subtitle {
  font-size: 1.4rem;
  font-style: italic;
  color: var(--secondary);
  margin: 28px 0 0;
}
/* 统计盒 stats-box */
.ik-scroll .ik-stats {
  background: rgba(255, 249, 230, 0.7);
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 18px 22px;
  max-width: 800px;
  margin: 30px auto 46px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
}
.ik-scroll .ik-stats p {
  margin: 8px 0;
  font-size: 1.05rem;
}
.ik-scroll .ik-stats .count {
  font-weight: bold;
  color: var(--secondary);
  font-size: 1.3rem;
}
/* 内容网格 */
.ik-scroll .ik-grid {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 35px;
  min-height: 220px;
}
/* 笔记本卡片 = motto-card 变体：随机微旋转 + 斜线纹理 + hover 回正放大 */
.ik-scroll .ik-book {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 3px 3px 10px var(--shadow);
  padding: 30px 22px 24px 46px;
  position: relative;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  animation: ik-card-in 0.5s ease-out both;
}
.ik-scroll .ik-book:nth-child(3n+1) { transform: rotate(-1deg); }
.ik-scroll .ik-book:nth-child(3n+2) { transform: rotate(0.5deg); }
.ik-scroll .ik-book:nth-child(3n+3) { transform: rotate(1.2deg); }
/* 斜线虚格纹理 */
.ik-scroll .ik-book::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.08"><rect fill="none" width="100" height="100"/><path d="M20,0 L0,20" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/><path d="M40,0 L0,40" stroke="%235d4037" stroke-width="0.5" stroke-dasharray="5,5"/></svg>');
  background-size: 30px 30px;
  pointer-events: none;
}
/* 书脊：棕系缝线装订条 */
.ik-scroll .ik-book::after {
  content: "";
  position: absolute;
  top: 14px;
  bottom: 14px;
  left: 13px;
  width: 9px;
  background:
    repeating-linear-gradient(180deg, rgba(255, 249, 230, 0.5) 0 4px, transparent 4px 10px),
    linear-gradient(90deg, #8d6e63, var(--secondary));
  border-radius: 2px;
  box-shadow: 1px 0 0 rgba(62, 39, 35, 0.15);
  opacity: 0.85;
}
.ik-scroll .ik-book:hover {
  transform: rotate(0) scale(1.02);
  box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
  z-index: 2;
}
@keyframes ik-card-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
/* 卡片头部：图标章 + 可点击书名 */
.ik-scroll .ik-head {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}
.ik-scroll .ik-icon {
  width: 42px;
  height: 42px;
  border-radius: 4px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 1.1rem;
  color: #fff9e6;
  background: linear-gradient(135deg, var(--secondary), #8d6e63);
  border: 1px solid rgba(62, 39, 35, 0.45);
  box-shadow: 2px 2px 5px var(--shadow);
}
.ik-scroll .ik-name {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin: 0;
  color: var(--primary);
  line-height: 1.5;
}
.ik-scroll .ik-name a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s ease;
}
.ik-scroll .ik-name a:hover { color: var(--secondary); }
.ik-scroll .ik-open {
  font-size: 0.72rem;
  font-weight: 400;
  margin-left: 0.45rem;
  color: var(--secondary);
  text-decoration: none;
  border-bottom: 1px dashed var(--border);
  white-space: nowrap;
}
.ik-scroll .ik-open:hover {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.ik-scroll .ik-sub {
  color: var(--secondary);
  opacity: 0.78;
  font-style: italic;
  font-size: 0.86rem;
  margin: 0.7rem 0 0;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* 文章列表行：dashed 分隔 + 右对齐 italic 日期 */
.ik-scroll .ik-articles {
  list-style: none;
  margin: 0.85rem 0 0;
  padding: 0;
}
.ik-scroll .ik-articles li { border-top: 1px dashed var(--border); }
.ik-scroll .ik-article {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 0.2rem;
  font-size: 0.89rem;
  color: var(--primary);
  text-decoration: none;
  transition: background 0.2s ease, padding-left 0.25s ease;
}
.ik-scroll .ik-article i {
  color: var(--secondary);
  opacity: 0.75;
  width: 16px;
  text-align: center;
  font-size: 0.82rem;
  flex-shrink: 0;
}
.ik-scroll .ik-article time {
  margin-left: auto;
  font-style: italic;
  font-size: 0.78rem;
  color: var(--secondary);
  white-space: nowrap;
}
.ik-scroll .ik-article:hover {
  background: rgba(93, 64, 55, 0.07);
  padding-left: 0.6rem;
}
.ik-scroll .ik-empty-tip {
  padding: 0.7rem 0.2rem 0.2rem;
  font-family: 'Ma Shan Zheng', cursive;
  color: var(--secondary);
  font-size: 1rem;
}
/* 分页：规范圆形按钮 #d7ccc8 */
.ik-scroll .ik-pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  margin: 44px 0 6px;
  position: relative;
  z-index: 2;
}
.ik-scroll .ik-page-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #d7ccc8;
  border: none;
  color: var(--primary);
  font-family: 'Noto Serif SC', serif;
  font-size: 1.05rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
  transition: all 0.3s ease;
}
.ik-scroll .ik-page-btn:hover:not(:disabled) {
  background: var(--secondary);
  color: #fff9e6;
  transform: translateY(-3px);
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
}
.ik-scroll .ik-page-btn.active {
  background: var(--secondary);
  color: #fff9e6;
}
.ik-scroll .ik-page-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
/* 加载/空态 */
.ik-scroll .ik-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 56px 0;
  color: var(--secondary);
  font-size: 1.05rem;
  font-style: italic;
}
.ik-scroll .ik-state .spin {
  display: inline-block;
  width: 15px;
  height: 15px;
  margin-right: 10px;
  vertical-align: -2px;
  border: 2px solid var(--border);
  border-top-color: var(--secondary);
  border-radius: 50%;
  animation: ik-spin 1s linear infinite;
}
@keyframes ik-spin { to { transform: rotate(360deg); } }
/* 页脚：手写体收尾 */
.ik-scroll .ik-foot {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-top: 40px;
}
.ik-scroll .ik-foot p {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.1rem;
  color: var(--secondary);
  margin: 0;
}
/* 响应式 */
@media (max-width: 900px) {
  .ik-scroll { padding: 34px 22px 28px; }
  .ik-scroll .ik-title { font-size: 3rem; }
}
@media (max-width: 768px) {
  .ik-scroll .ik-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
  .ik-scroll .ik-title { font-size: 2.5rem; }
  .ik-scroll .ik-subtitle { font-size: 1.2rem; }
  .ik-scroll .ik-book { padding: 24px 18px 20px 40px; min-height: 200px; }
  .ik-scroll .ik-page-btn { width: 40px; height: 40px; }
}
@media (max-width: 480px) {
  .ik-scroll .ik-grid { grid-template-columns: 1fr; }
  .ik-scroll .ik-title { font-size: 2.2rem; }
  .ik-scroll .ik-pagination { gap: 12px; }
  .ik-scroll .ik-dec { display: none; }
}
/* 无动画偏好：停用旋转/过渡/入场 */
@media (prefers-reduced-motion: reduce) {
  .ik-scroll *,
  .ik-scroll *::before,
  .ik-scroll *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>

<script>
(function () {
  'use strict';
  var currentPage = 1;
  var notebooksPerPage = 4;
  var totalPages = 1;
  var allNotebooks = [];

  function generateArticleUrl(notebookSlug, article) {
    if (article.slug) return '/categories/' + notebookSlug + '/' + encodeURIComponent(article.slug) + '/';
    return '/categories/' + notebookSlug + '/' +
      article.title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '/';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function updateStats() {
    var nbEl = document.getElementById('notebookCount');
    var arEl = document.getElementById('articleCount');
    var totalArticles = 0;
    allNotebooks.forEach(function (nb) {
      totalArticles += (nb.articles || []).length;
    });
    if (nbEl) nbEl.textContent = allNotebooks.length;
    if (arEl) arEl.textContent = totalArticles;
  }

  function loadNotebooks() {
    var grid = document.getElementById('notebooks-grid');
    if (!grid) return;
    grid.innerHTML = '<div class="ik-state"><span class="spin"></span>正在翻动信笺…</div>';
    fetch('notebooks.json')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        allNotebooks = data || [];
        totalPages = Math.max(1, Math.ceil(allNotebooks.length / notebooksPerPage));
        updateStats();
        renderNotebooks(currentPage);
        renderPagination(currentPage);
      })
      .catch(function (err) {
        console.error('加载笔记本数据失败:', err);
        grid.innerHTML = '<div class="ik-state">数据加载失败，请刷新重试</div>';
      });
  }

  function renderNotebooks(page) {
    var container = document.getElementById('notebooks-grid');
    if (!container) return;
    if (!allNotebooks.length) {
      container.innerHTML = '<div class="ik-state">册页尚空，落笔为开</div>';
      return;
    }
    var start = (page - 1) * notebooksPerPage;
    var pageData = allNotebooks.slice(start, start + notebooksPerPage);
    container.innerHTML = pageData.map(function (nb) {
      var items = (nb.articles || []).map(function (a) {
        // 优先使用 CMS 维护的真实 URL（notebooks.json 的 url 字段）；回退按 slug 猜测
        var href = a.url || generateArticleUrl(nb.slug, a);
        return '<li><a class="ik-article" href="' + esc(href) + '">' +
          '<i class="' + esc(a.icon || 'fas fa-file-alt') + '"></i>' +
          '<span>' + esc(a.title) + '</span>' +
          (a.date ? '<time>' + esc(a.date) + '</time>' : '') +
          '</a></li>';
      }).join('');
      if (!items) items = '<li class="ik-empty-tip">这一册还空着，等一个开头。</li>';
      var nbHref = '/notes/' + encodeURIComponent(nb.slug) + '/';
      return '' +
        '<article class="ik-book" style="cursor:pointer" onclick="if(!event.target.closest(\'a\'))location.href=\'' + nbHref + '\'">' +
        '  <div class="ik-head">' +
        '    <span class="ik-icon"><i class="' + esc(nb.icon || 'fas fa-book') + '"></i></span>' +
        '    <h2 class="ik-name"><a href="' + nbHref + '">' + esc(nb.name) + '</a>' +
        '      <a class="ik-open" href="' + nbHref + '">翻开本册 →</a></h2>' +
        '  </div>' +
        '  <p class="ik-sub">' + esc(nb.subtitle || '') + '</p>' +
        '  <ul class="ik-articles">' + items + '</ul>' +
        '</article>';
    }).join('');
    // 入场渐显的错峰延迟
    Array.prototype.forEach.call(container.querySelectorAll('.ik-book'), function (card, i) {
      card.style.animationDelay = (i * 90) + 'ms';
    });
  }

  function renderPagination(page) {
    var box = document.getElementById('pagination');
    if (!box) return;
    if (totalPages <= 1) { box.innerHTML = ''; return; }
    var html = '<button class="ik-page-btn" data-p="prev"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button class="ik-page-btn' + (i === page ? ' active' : '') + '" data-p="' + i + '">' + i + '</button>';
    }
    html += '<button class="ik-page-btn" data-p="next"' + (page >= totalPages ? ' disabled' : '') + '>›</button>';
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.ik-page-btn'), function (btn) {
      btn.addEventListener('click', function () {
        if (this.disabled) return;
        var v = this.getAttribute('data-p');
        if (v === 'prev') currentPage = Math.max(1, currentPage - 1);
        else if (v === 'next') currentPage = Math.min(totalPages, currentPage + 1);
        else currentPage = parseInt(v, 10);
        renderNotebooks(currentPage);
        renderPagination(currentPage);
      });
    });
  }

  function boot() { loadNotebooks(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
